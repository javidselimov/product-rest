# Shared query/path parameters. Referenced as ../components/parameters.yaml#/<Name>.

Locale:
  name: locale
  in: query
  description: |
    Content locale. Not validated: an unknown value yields empty lists and null
    translated fields rather than an error. Page visibility (`showAz`/`showEn`)
    treats `en` as English and anything else as Azerbaijani.
  schema:
    type: string
    enum: [az, en]
    default: az

Page:
  name: page
  in: query
  description: 1-based page number. Out-of-range values are clamped to 1..100000, not rejected.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100000
    default: 1

PageSize:
  name: pageSize
  in: query
  description: Items per page. Out-of-range values are clamped to 1..100, not rejected.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 10

Slug:
  name: slug
  in: path
  required: true
  description: Locale-scoped slug (unique per locale). Send it URL-encoded; the API compares it verbatim.
  schema:
    type: string

IntId:
  name: id
  in: path
  required: true
  schema:
    type: integer
    format: int32
