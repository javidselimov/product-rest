# Shared responses. Referenced as ../components/responses.yaml#/<Name>.

NotFound:
  description: |
    Not found, or not visible to the public (unpublished, embargoed by `publishedAt`,
    inactive, soft-deleted, or not shown in this locale). Produced by `[ApiController]`'s
    client-error mapping of a bare `NotFound()`.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas/common.yaml#/ProblemDetails

BadRequest:
  description: A query or route value could not be bound (e.g. `page=abc`, malformed date).
  content:
    application/problem+json:
      schema:
        $ref: ./schemas/common.yaml#/ValidationProblemDetails

TooManyRequests:
  description: |
    Rate limit exceeded: fixed window of 1000 requests per minute per client IP
    (first `X-Forwarded-For` value, else the remote address). The body is empty.
