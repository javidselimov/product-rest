EventType:
  type: integer
  format: int16
  enum: [1, 2, 3, 4]
  description: "`1` = decision, `2` = press conference, `3` = conference, `4` = seminar."

EventCategory:
  type: object
  required: [id, name]
  properties:
    id:
      type: integer
      format: int32
    name:
      type: string

EventListItem:
  type: object
  required: [id, title, slug, type, category, startsOn, endsOn, startTime, location, upcoming, pageSlug]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    type:
      oneOf:
        - $ref: '#/EventType'
        - type: 'null'
    category:
      description: Null when none is set or it has no name in this locale. An inactive category is still returned.
      oneOf:
        - $ref: '#/EventCategory'
        - type: 'null'
    startsOn:
      type: string
      format: date
    endsOn:
      type: [string, 'null']
      format: date
      description: Null for a one-day event.
    startTime:
      type: [string, 'null']
      description: "`HH:mm`, Asia/Baku time."
    location:
      type: [string, 'null']
    upcoming:
      type: boolean
      description: The end date, or the start date, is today or later in Asia/Baku.
    pageSlug:
      type: [string, 'null']
      description: Set when the event links to a CMS page that is public in this locale; the site opens that page.

EventPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/EventListItem'

EventGallery:
  type: object
  required: [title, images]
  properties:
    title:
      type: [string, 'null']
    images:
      type: array
      items:
        type: object
        required: [mediaId, url]
        properties:
          mediaId:
            type: integer
            format: int64
          url:
            type: string

EventPressRelease:
  type: object
  required: [title, slug]
  properties:
    title:
      type: string
    slug:
      type: string

EventDetail:
  allOf:
    - $ref: '#/EventListItem'
    - type: object
      required: [content, gallery, pressRelease]
      properties:
        content:
          type: [string, 'null']
          description: HTML.
        gallery:
          description: Null when none is linked or the gallery is not active.
          oneOf:
            - $ref: '#/EventGallery'
            - type: 'null'
        pressRelease:
          description: Null when none is linked or it is not public in this locale.
          oneOf:
            - $ref: '#/EventPressRelease'
            - type: 'null'
