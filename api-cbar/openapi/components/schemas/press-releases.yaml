PressReleaseType:
  type: integer
  format: int16
  enum: [1, 2, 3]
  description: "`1` = news, `2` = announcement, `3` = interview or speech."

PressReleaseListItem:
  type: object
  required: [id, type, title, slug, publishedAt, imageUrl]
  properties:
    id:
      type: integer
      format: int32
    type:
      $ref: '#/PressReleaseType'
    title:
      type: string
    slug:
      type: string
    publishedAt:
      $ref: ./common.yaml#/DateTime
      description: Never null here — undated press releases are excluded from public output.
    imageUrl:
      $ref: ./common.yaml#/NullableMediaUrl
      description: First attached asset whose MIME type is `image/*`, among those shown in `locale`.

PressReleasePage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/PressReleaseListItem'

PressReleaseDetail:
  type: object
  required: [id, type, title, slug, content, publishedAt, assets]
  properties:
    id:
      type: integer
      format: int32
    type:
      $ref: '#/PressReleaseType'
    title:
      type: string
    slug:
      type: string
    content:
      $ref: ./common.yaml#/NullableString
      description: Rich-text HTML.
    publishedAt:
      $ref: ./common.yaml#/DateTime
    assets:
      type: array
      description: |
        Attachments shown in `locale`: those with no language, or with this language. The
        site splits them by `type`.
      items:
        $ref: ./common.yaml#/AssetFile
