CsrProject:
  type: object
  required: [id, category, cardTitle, summary, title, content, cover, images]
  properties:
    id:
      type: integer
      format: int32
    category:
      type: [string, 'null']
      description: The category name in the locale. Null without a translation of the category.
    cardTitle:
      type: string
    summary:
      type: string
    title:
      type: string
      description: The dialog heading.
    content:
      type: [string, 'null']
      description: HTML.
    cover:
      type: [string, 'null']
      description: "`/media/{id}` of the card image. Null when none is set; the site then uses the first photo."
    images:
      type: array
      description: The photos, in display order.
      items:
        $ref: '#/CsrProjectImage'

CsrProjectImage:
  type: object
  required: [mediaId, url]
  properties:
    mediaId:
      type: integer
      format: int64
    url:
      type: string
      description: "`/media/{id}`."
