HomepageBanner:
  type: object
  required: [title, link, description, imageUrl]
  properties:
    title:
      $ref: ./common.yaml#/NullableString
    link:
      $ref: ./common.yaml#/NullableString
    description:
      $ref: ./common.yaml#/NullableString
    imageUrl:
      $ref: ./common.yaml#/NullableMediaUrl

HomepageNewsSlide:
  type: object
  required: [title, description, link, imageUrl, newsDate]
  properties:
    title:
      type: string
    description:
      $ref: ./common.yaml#/NullableString
    link:
      $ref: ./common.yaml#/NullableString
    imageUrl:
      $ref: ./common.yaml#/NullableMediaUrl
    newsDate:
      $ref: ./common.yaml#/Date

HomepageLink:
  type: object
  required: [title, url]
  properties:
    title:
      type: string
    url:
      type: string

HomepagePublication:
  type: object
  required: [title, url, imageUrl, publishedAt]
  properties:
    title:
      type: string
    url:
      $ref: ./common.yaml#/NullableString
    imageUrl:
      $ref: ./common.yaml#/NullableMediaUrl
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime

StrategyDoc:
  description: |
    A card of the "Strategiya və sənədlər" block (spec 057). The site shows the first three, the first as the large card.
  type: object
  required: [id, title, summary, coverUrl, href]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    summary:
      $ref: ./common.yaml#/NullableString
      description: Shown on the narrow cards only.
    coverUrl:
      $ref: ./common.yaml#/NullableMediaUrl
      description: The cover of this locale, else the other locale's; null without either.
    href:
      type: string
      description: |
        Where the card goes: the document's URL for this locale (an absolute `http(s)://` URL or a site path), else
        `/<slug>` of its linked page in this locale. A site path carries no locale prefix; the site adds it.

InfoLineItem:
  type: object
  required: [title, value, year, updatedAt]
  properties:
    title:
      type: string
    value:
      $ref: ./common.yaml#/NullableString
    year:
      type: [integer, 'null']
      format: int16
    updatedAt:
      $ref: ./common.yaml#/DateTime
      description: |
        When an editor last saved the line (`info_lines.updated_at`). Not the decision's
        effective date — the schema has none; a typo fix moves it too.

InfoLineGroup:
  type: object
  required: [alias, items]
  properties:
    alias:
      type: string
      description: Block identifier the frontend places the group by.
    items:
      type: array
      items:
        $ref: '#/InfoLineItem'

Homepage:
  description: |
    Everything active for the locale. Banners and running lines also honour their
    `startsAt`/`endsAt` window. Only items translated into the locale are included
    (running lines: only their texts in the locale). Strategy documents are published, not deleted, titled in the locale
    and have a working link there: a `url`, or a linked page that is published, active, shown in the locale and has a
    slug in it; by sort order, not limited.
  type: object
  required: [banners, newsSlider, runningLines, links, publications, infoLines, strategyDocs]
  properties:
    banners:
      type: array
      items:
        $ref: '#/HomepageBanner'
    newsSlider:
      type: array
      items:
        $ref: '#/HomepageNewsSlide'
    runningLines:
      type: array
      items:
        type: string
    links:
      type: array
      items:
        $ref: '#/HomepageLink'
    publications:
      type: array
      items:
        $ref: '#/HomepagePublication'
    infoLines:
      type: array
      description: Grouped by alias, groups in alias order.
      items:
        $ref: '#/InfoLineGroup'
    strategyDocs:
      type: array
      items:
        $ref: '#/StrategyDoc'
