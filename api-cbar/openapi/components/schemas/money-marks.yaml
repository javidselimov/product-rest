MoneyMarkType:
  type: integer
  format: int16
  description: '1 = banknote, 2 = coin.'
  enum: [1, 2]

MoneyMarkListItem:
  type: object
  required: [id, title, slug, categoryName, frontImageUrl, rearImageUrl]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    categoryName:
      $ref: ./common.yaml#/NullableString
    frontImageUrl:
      $ref: ./common.yaml#/NullableMediaUrl
    rearImageUrl:
      $ref: ./common.yaml#/NullableMediaUrl

MoneyMarkDetail:
  type: object
  required: [id, title, slug, description, securityFeatures, type, categoryName, frontImageUrl, rearImageUrl]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    description:
      $ref: ./common.yaml#/NullableString
      description: Rich-text HTML.
    securityFeatures:
      $ref: ./common.yaml#/NullableString
      description: Rich-text HTML.
    type:
      $ref: '#/MoneyMarkType'
    categoryName:
      $ref: ./common.yaml#/NullableString
    frontImageUrl:
      $ref: ./common.yaml#/NullableMediaUrl
    rearImageUrl:
      $ref: ./common.yaml#/NullableMediaUrl

MoneyMarkNewsListItem:
  type: object
  required: [id, title, slug, publishedAt]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    publishedAt:
      $ref: ./common.yaml#/DateTime
      description: Never null here — undated news is excluded from public output.

MoneyMarkNewsPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/MoneyMarkNewsListItem'

MoneyMarkNewsDetail:
  type: object
  required: [id, title, slug, content, publishedAt]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    content:
      $ref: ./common.yaml#/NullableString
      description: Rich-text HTML.
    publishedAt:
      $ref: ./common.yaml#/DateTime
