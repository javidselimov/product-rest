ReleaseSchedule:
  type: object
  required: [groups, decisions]
  properties:
    groups:
      type: array
      items:
        $ref: '#/ReleaseScheduleGroup'
    decisions:
      $ref: '#/ReleaseScheduleDecisions'

ReleaseScheduleGroup:
  type: object
  required: [id, name, items]
  properties:
    id:
      type: integer
      format: int32
    name:
      type: string
      description: The group name in the locale.
    items:
      type: array
      minItems: 1
      items:
        $ref: '#/ReleaseScheduleItem'

ReleaseScheduleItem:
  type: object
  required: [id, title, periodicity, timing, timingMode, timingUrl]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    periodicity:
      type: [string, 'null']
      description: The periodicity name in the locale; null without a periodicity or a translation of it.
    timing:
      type: [string, 'null']
      description: By when it is published; null when blank.
    timingMode:
      type: string
      enum: [text, link, decisions]
      description: >-
        `text` is plain text, `link` links to `timingUrl`, `decisions` opens the monetary policy
        decisions dialog.
    timingUrl:
      type: [string, 'null']
      description: Set only in the `link` mode. `http(s)://…` or a site path starting with `/`, without the locale.

ReleaseScheduleDecisions:
  type: object
  required: [year, dates, next]
  properties:
    year:
      type: integer
      format: int32
      description: The current year in Baku time.
    dates:
      type: array
      description: The decision dates of `year`, each once, ascending. May be empty.
      items:
        $ref: '#/ReleaseScheduleDecisionDate'
    next:
      description: The first decision date from today on (Baku time), in any year; null when none is planned.
      oneOf:
        - $ref: '#/ReleaseScheduleDecisionDate'
        - type: 'null'

ReleaseScheduleDecisionDate:
  type: object
  required: [date, withPressConference]
  properties:
    date:
      $ref: ./common.yaml#/Date
    withPressConference:
      type: boolean
      description: A published press conference event (type 2) falls on the same day.
