# FAQ (spec 051). Referenced as ../components/schemas/faq.yaml#/<Name>.

FaqQuestion:
  type: object
  required: [id, question, answer]
  properties:
    id:
      type: integer
      description: Stable id; the site links a question as `#sual-<id>` in both locales.
    question:
      type: string
      maxLength: 1000
    answer:
      type: string
      description: Answer HTML as the admin rich-text editor saved it. The site sanitizes it before rendering.

FaqTopic:
  type: object
  required: [slug, name, questions]
  properties:
    slug:
      type: string
      description: Locale-independent key, fixed at creation; the site selects a topic with `?topic=<slug>`.
      example: pul-siyaseti
    name:
      type: string
    questions:
      type: array
      description: Questions with a non-blank question and answer in the locale, by `sortOrder`, then `id`. Never empty.
      items:
        $ref: '#/FaqQuestion'

FaqVideo:
  type: object
  required: [id, youtubeUrl, title]
  properties:
    id:
      type: integer
    youtubeUrl:
      type: string
      format: uri
      example: https://www.youtube.com/watch?v=FZrEo1nXlgs
    title:
      type: string

Faq:
  type: object
  required: [topics, videos]
  properties:
    topics:
      type: array
      items:
        $ref: '#/FaqTopic'
    videos:
      type: array
      items:
        $ref: '#/FaqVideo'

FaqTopicLink:
  type: object
  description: A topic linked to a CMS page; the page shows it as a link card to the FAQ page.
  required: [slug, name, questionCount]
  properties:
    slug:
      type: string
    name:
      type: string
    questionCount:
      type: integer
      minimum: 1
      description: Questions visible in the locale.
