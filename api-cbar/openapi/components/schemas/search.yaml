SearchResultType:
  type: string
  enum: [page, press-release, law, money-mark, staff, event, csr-project]

SearchResult:
  type: object
  required: [title, url, type, snippet]
  properties:
    title:
      type: string
    url:
      type: string
      description: |
        Frontend route (not an API route), already locale-prefixed, e.g.
        `/az/laws/{slug}`, `/az/press-releases/{slug}`, `/az/national-currency/{slug}`,
        `/az/organization/staff/detail/{id}`, `/az/media/events/{slug}`, `/az/{pageSlug}`.
    type:
      $ref: '#/SearchResultType'
    snippet:
      type: string
      description: |
        Pages: tag-stripped ±80 characters around the first match (with `…`), else the title.
        Staff: position, else full name. Other types: the title.

SearchResponse:
  type: object
  required: [results]
  properties:
    results:
      type: array
      maxItems: 30
      description: At most 12 per type, 30 in total; title matches rank before content matches.
      items:
        $ref: '#/SearchResult'
