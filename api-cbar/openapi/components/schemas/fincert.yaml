# FinCERT (spec 053). Referenced as ../components/schemas/fincert.yaml#/<Name>.

FincertPortal:
  type: object
  required: [title, description, url]
  properties:
    title:
      type: string
    description:
      type: [string, 'null']
    url:
      type: string
      format: uri
      example: https://portal.e-cbar.az/

FincertRfcFile:
  type: object
  required: [url, mimeType, sizeBytes]
  properties:
    url:
      type: string
      description: "`/media/{id}` on this API."
      example: /media/1234
    mimeType:
      type: string
      example: application/pdf
    sizeBytes:
      type: integer
      format: int64

FincertRfc:
  type: object
  required: [file, url]
  description: At least one of `file` and `url` is set. The site prefers `file`.
  properties:
    file:
      description: The RFC-2350 document of this locale from the media library; null when there is none or it is deleted.
      oneOf:
        - $ref: '#/FincertRfcFile'
        - type: 'null'
    url:
      type: [string, 'null']
      description: External link (the legacy file address until an editor uploads the document).

FincertDirection:
  type: object
  required: [id, title, body]
  properties:
    id:
      type: integer
    title:
      type: string
    body:
      type: string
      description: HTML as the admin rich-text editor saved it. The site sanitizes it before rendering.

FincertMembership:
  type: object
  required: [id, name, description, badge, url, logo]
  properties:
    id:
      type: integer
    name:
      type: string
    description:
      type: [string, 'null']
    badge:
      type: [string, 'null']
      example: 2026-cı ildən tam hüquqlu üzv
    url:
      type: [string, 'null']
    logo:
      type: [string, 'null']
      description: "`/media/{id}`, or null when there is no logo or its file is deleted."
      example: /media/1301

Fincert:
  type: object
  required: [mission, email, phone, portal, rfc, directions, memberships]
  properties:
    mission:
      type: [string, 'null']
      description: Plain text; line breaks separate paragraphs.
    email:
      type: [string, 'null']
    phone:
      type: [string, 'null']
      description: As the editor wrote it, e.g. `(+994 12) 437 00 97`.
    portal:
      description: Null unless the portal URL and this locale's portal title are both filled.
      oneOf:
        - $ref: '#/FincertPortal'
        - type: 'null'
    rfc:
      description: Null when this locale has neither a document nor a link.
      oneOf:
        - $ref: '#/FincertRfc'
        - type: 'null'
    directions:
      type: array
      description: Published, not deleted, with a title and a non-blank body in the locale; by `sortOrder`, then `id`.
      items:
        $ref: '#/FincertDirection'
    memberships:
      type: array
      description: Published, not deleted, with a name in the locale; by `sortOrder`, then `id`.
      items:
        $ref: '#/FincertMembership'
