LawType:
  type: integer
  format: int16
  description: '1 = law, 2 = regulation.'
  enum: [1, 2]

LawListItem:
  type: object
  required: [id, title, slug, publishedAt, categoryName]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
      description: Laws without a date are public; a future date embargoes the law.
    categoryName:
      $ref: ./common.yaml#/NullableString

LawPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/LawListItem'

LawDetail:
  type: object
  required: [id, title, slug, description, publishedAt, categoryName, assets]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    description:
      $ref: ./common.yaml#/NullableString
      description: Rich-text HTML.
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    categoryName:
      $ref: ./common.yaml#/NullableString
    assets:
      type: array
      items:
        $ref: ./common.yaml#/AssetFile
