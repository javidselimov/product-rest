MonthlyReportSeries:
  type: object
  required: [key, name, periodMonths, reports]
  properties:
    key:
      type: string
      description: Stable series key.
      examples: [bank-complaint-index, insurance-complaint-index, infographics]
    name:
      type: string
      description: The series' name in the locale (az when the locale has none); the site titles each report with it and the period.
    periodMonths:
      type: integer
      format: int16
      minimum: 1
      maximum: 12
      description: A report covers this many months ending with its own month (12 for the insurance index).
    reports:
      type: array
      minItems: 1
      items:
        $ref: '#/MonthlyReport'

MonthlyReport:
  type: object
  required: [id, year, month, file]
  properties:
    id:
      type: integer
      format: int32
    year:
      type: integer
      format: int16
    month:
      type: integer
      format: int16
      minimum: 1
      maximum: 12
    file:
      $ref: '#/MonthlyReportFile'

MonthlyReportFile:
  type: object
  required: [id, url, mimeType, sizeBytes]
  properties:
    id:
      type: integer
      format: int64
    url:
      type: string
      description: Relative media address, `/media/{id}`, as in page assets.
    mimeType:
      type: string
    sizeBytes:
      type: integer
      format: int64
