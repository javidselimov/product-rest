Memorandum:
  type: object
  required: [id, organization, country, year]
  properties:
    id:
      type: integer
      format: int32
    organization:
      type: string
      description: The counterparty — a central bank, a ministry or a supervisor.
    country:
      type: string
    year:
      type: integer
      format: int16
      description: The year of signing.
