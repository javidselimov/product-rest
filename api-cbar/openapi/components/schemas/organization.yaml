StaffType:
  type: integer
  format: int16
  description: '1 = board, 2 = director general, 3 = adviser to the Governor (2 and 3 make up the public "Management" page).'
  enum: [1, 2, 3]

StaffMember:
  type: object
  required: [id, fullName, position, receptionDays, phone, bio, photoUrl]
  properties:
    id:
      type: integer
      format: int32
    fullName:
      type: string
    position:
      $ref: ./common.yaml#/NullableString
    receptionDays:
      $ref: ./common.yaml#/NullableString
    phone:
      $ref: ./common.yaml#/NullableString
    bio:
      $ref: ./common.yaml#/NullableString
      description: Rich-text HTML.
    photoUrl:
      $ref: ./common.yaml#/NullableMediaUrl

StaffPhoto:
  description: A downloadable press photo of a staff member, in the CMS order.
  allOf:
    - $ref: ./common.yaml#/AssetFile
    - type: object
      required: [width, height]
      properties:
        width:
          type: [integer, 'null']
          format: int32
          description: Pixel width as recorded at upload; null when the asset carries no dimensions.
        height:
          type: [integer, 'null']
          format: int32

StaffMemberDetail:
  allOf:
    - $ref: '#/StaffMember'
    - type: object
      required: [type, photos]
      properties:
        type:
          $ref: '#/StaffType'
        photos:
          type: array
          description: Press photos for download; empty when none are attached.
          items:
            $ref: '#/StaffPhoto'

Division:
  description: A structural division (department); its page shows the description and the regulation document (Figma `1003:12461`).
  type: object
  required: [id, name, description, regulation]
  properties:
    id:
      type: integer
      format: int32
    name:
      type: string
    description:
      $ref: ./common.yaml#/NullableString
    regulation:
      description: The division regulation ("Əsasnamə") in the requested locale; null when none is attached.
      oneOf:
        - $ref: ./common.yaml#/AssetFile
        - type: 'null'

Office:
  description: A regional office card (Figma `2046:3531`) — photo, address, phone, head and the regulation document.
  type: object
  required: [id, name, address, phone, directorName, photoUrl, regulation]
  properties:
    id:
      type: integer
      format: int32
    name:
      type: string
    address:
      $ref: ./common.yaml#/NullableString
    phone:
      $ref: ./common.yaml#/NullableString
    directorName:
      $ref: ./common.yaml#/NullableString
      description: Head of the office ("Rəhbər").
    photoUrl:
      $ref: ./common.yaml#/NullableMediaUrl
    regulation:
      description: The office regulation ("Əsasnamə") in the requested locale; null when none is attached.
      oneOf:
        - $ref: ./common.yaml#/AssetFile
        - type: 'null'

OrgChartKind:
  type: integer
  format: int16
  description: |
    `1` = governor, `2` = deputy governor, `3` = director general, `4` = block,
    `5` = department, `6` = group (a labelled frame around its children).
  enum: [1, 2, 3, 4, 5, 6]

OrgChartLayout:
  deprecated: true
  description: |
    Deprecated since spec 060: the site lays the desktop chart out from the tree and no longer
    reads this. Desktop position on a 984 px wide canvas, origin top-left, CSS pixels. Tablet and mobile
    ignore it and stack the tree.
  type: object
  required: [x, y, w, h]
  properties:
    x:
      type: number
    y:
      type: number
    w:
      type: number
    h:
      type: number

OrgChartLink:
  description: Page the card opens — `/organization/staff/detail/{id}` or `/organization/divisions/{id}`.
  type: object
  required: [type, id]
  properties:
    type:
      type: string
      enum: [staff, division]
    id:
      type: integer
      format: int32

OrgChartNode:
  type: object
  required: [id, parentId, kind, curatorDirect, name, role, link, departmentsOpen, layout, connector]
  properties:
    id:
      type: integer
      format: int32
    parentId:
      type: [integer, 'null']
      format: int32
      description: Null for a root (the governor).
    kind:
      $ref: '#/OrgChartKind'
    curatorDirect:
      type: boolean
      description: Directly subordinate to the curator — shown with `*` and the chart footnote.
    name:
      type: string
      description: The node's own title, else the linked staff member's full name or division name.
    role:
      $ref: ./common.yaml#/NullableString
      description: The node's own subtitle, else the linked staff member's position.
    link:
      anyOf:
        - $ref: '#/OrgChartLink'
        - type: 'null'
      description: Null when nothing is linked; the card is then not clickable.
    departmentsOpen:
      type: boolean
      description: |
        Block (4) or group (6): its departments are always open on the desktop chart instead of a
        dropdown (spec 060). Always false for the other kinds.
    layout:
      anyOf:
        - $ref: '#/OrgChartLayout'
        - type: 'null'
      deprecated: true
      description: Deprecated since spec 060. Null when the node was not placed on the old desktop canvas.
    connector:
      deprecated: true
      description: |
        Deprecated since spec 060. Hand-drawn line from the parent as canvas points `[x, y]`; null draws the automatic
        elbow line.
      type: [array, 'null']
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: number
