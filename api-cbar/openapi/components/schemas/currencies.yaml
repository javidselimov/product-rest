CurrencyRate:
  type: object
  required: [code, nominal, name, rate, showOnHomepage]
  properties:
    code:
      type: string
      description: ISO 4217 code.
      minLength: 3
      maxLength: 3
      examples: [USD]
    nominal:
      type: integer
      format: int32
      description: Number of currency units the rate applies to.
    name:
      $ref: ./common.yaml#/NullableString
      description: Currency name in the requested locale; null when untranslated.
    rate:
      type: number
      description: AZN per `nominal` units, up to 4 decimal places (numeric(12,4)).
    showOnHomepage:
      type: boolean

CurrencyRateSheet:
  type: object
  required: [date, rates]
  properties:
    date:
      $ref: ./common.yaml#/Date
    rates:
      type: array
      description: Ordered by the currency's sort order. Empty when the requested date has no sheet.
      items:
        $ref: '#/CurrencyRate'
