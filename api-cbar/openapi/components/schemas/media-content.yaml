GalleryListItem:
  type: object
  required: [id, title, eventDate, imageCount, coverUrl]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    eventDate:
      $ref: ./common.yaml#/NullableDate
    imageCount:
      type: integer
      format: int32
    coverUrl:
      $ref: ./common.yaml#/NullableMediaUrl
      description: First image by sort order; null for an empty gallery.

GalleryPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/GalleryListItem'

GalleryImage:
  type: object
  required: [mediaId, url]
  properties:
    mediaId:
      type: integer
      format: int64
    url:
      $ref: ./common.yaml#/MediaUrl

GalleryDetail:
  type: object
  required: [id, title, eventDate, images]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    eventDate:
      $ref: ./common.yaml#/NullableDate
    images:
      type: array
      items:
        $ref: '#/GalleryImage'

Video:
  type: object
  required: [id, title, youtubeUrl, publishedAt]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    youtubeUrl:
      type: string
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime

VideoPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/Video'

VideoStream:
  type: object
  required: [id, title, streamUrl, startsAt]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    streamUrl:
      type: string
    startsAt:
      $ref: ./common.yaml#/NullableDateTime

ImagePopup:
  type: object
  required: [id, imageUrl, link, altText]
  properties:
    id:
      type: integer
      format: int32
    imageUrl:
      $ref: ./common.yaml#/MediaUrl
    link:
      $ref: ./common.yaml#/NullableString
      description: Absolute http(s) URL or a site-relative path.
    altText:
      $ref: ./common.yaml#/NullableString
