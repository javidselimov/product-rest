PageNode:
  type: object
  required: [id, title, slug, navUrl, showInSideNav, showInDropdownNav, menuGroup, children]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    navUrl:
      $ref: ./common.yaml#/NullableString
      description: Menu-link override (app route or external URL); when set, link here instead of the slug.
    showInSideNav:
      type: boolean
      description: |
        Shown in its section's left menu (spec 041). When false, the page stays in the tree
        (top menu, footer, breadcrumb) and the site leaves it out of the left menu unless it,
        or a page under it, is open.
    showInDropdownNav:
      type: [boolean, 'null']
      description: |
        Shown in the dropdown menus below its section root (mega menu, mobile drawer; spec 054).
        null = follow `showInSideNav`. `showInSideNav: false` with `true` here is a page that only
        the dropdown menus list.
    menuGroup:
      $ref: ./common.yaml#/NullableString
      description: |
        Menu group label in the locale (spec 054): siblings with the same label form one group in
        the dropdown menus. Data only until the header redesign (spec 055).
    children:
      type: array
      items:
        $ref: '#/PageNode'

PageAsset:
  type: object
  required: [mediaId, title, mimeType, sizeBytes, group, url]
  properties:
    mediaId:
      type: integer
      format: int64
    title:
      type: string
      description: Asset title in the locale, else in any locale, else the file's original name.
    mimeType:
      type: string
    sizeBytes:
      type: integer
      format: int64
    group:
      $ref: ./common.yaml#/NullableString
      description: Editor-set accordion group label (e.g. a year).
    url:
      $ref: ./common.yaml#/MediaUrl

PageDetail:
  type: object
  required: [id, title, slug, content, assets]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
    slug:
      type: string
    content:
      $ref: ./common.yaml#/NullableString
      description: Rich-text HTML as stored by the CMS (may contain legacy markup, iframes, `<details>`).
    assets:
      type: array
      items:
        $ref: '#/PageAsset'
