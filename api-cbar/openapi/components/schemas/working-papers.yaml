WorkingPaperListItem:
  type: object
  required: [id, number, year, code, key, language, title, authors, keywords]
  properties:
    id:
      type: integer
      format: int32
    number:
      type: integer
      format: int16
    year:
      type: integer
      format: int16
    code:
      type: string
      description: '`NN/YYYY`, as the site shows it.'
      examples: ['02/2025']
    key:
      type: string
      description: '`NN-YYYY`, the address key of the item route.'
      examples: ['02-2025']
    language:
      type: string
      enum: [az, en, other]
      description: The language the paper is written in, not the requested locale.
    title:
      type: string
    authors:
      type: array
      description: In display order.
      items:
        type: string
    keywords:
      type: array
      items:
        type: string

WorkingPaper:
  allOf:
    - $ref: '#/WorkingPaperListItem'
    - type: object
      required: [abstract, jelCodes, file]
      properties:
        abstract:
          $ref: ./common.yaml#/NullableString
          description: Plain text; a line break starts a new paragraph.
        jelCodes:
          type: array
          items:
            type: string
          examples: [[C22, E53, E58]]
        file:
          description: The PDF of the locale; null when there is none or its media is deleted.
          oneOf:
            - $ref: ./common.yaml#/AssetFile
            - type: 'null'
