openapi: 3.1.1
info:
  title: cbar.az public API (api-cbar)
  version: 1.0.0
  description: |
    Read-only API behind the public cbar.az site. Connects to the shared database as the
    SELECT-only `cbar_web_ro` role; content is written by api-cbar-admin.

    **Everything is filtered for the public**: `status = published`, not soft-deleted,
    `isActive`, translated into (and shown in) the requested locale, and for dated
    content not embargoed by a future `publishedAt`. An empty list usually means no
    matching content, not an error.

    Conventions:
    - JSON is camelCase. Dates are `yyyy-MM-dd`, timestamps ISO 8601 with offset,
      money/rates are JSON numbers.
    - Paged lists return `{ items, total, page, pageSize }`; lookups and small lists
      return bare arrays.
    - Media fields are root-relative URLs (`/media/{id}`) on this API's origin.
    - All routes except `/healthz` and `/openapi/*` are rate-limited to 1000 req/min per client IP.
    - No authentication.

    This document is maintained by hand (see `README.md`); the runtime `/openapi/v1.json`
    carries no response schemas because the controllers return anonymous types.
  license:
    name: Proprietary
    identifier: LicenseRef-CBAR-Proprietary
