list:
  get:
    tags: [CsrProjects]
    operationId: listCsrProjects
    summary: Published CSR projects
    description: |
      Everything the corporate social responsibility page needs for its cards and dialogs, so the
      list has no paging and there is no item route: a project has no address of its own.
      Only published projects that are visible in the locale and have a translation in it,
      by `sortOrder`, then `id`.
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: The projects.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/csr-projects.yaml#/CsrProject
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
