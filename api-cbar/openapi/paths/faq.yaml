faq:
  get:
    tags: [Faq]
    operationId: getFaq
    summary: The published FAQ (spec 051)
    description: |
      Everything the FAQ page needs: topics with their questions and the videos. No paging; the site
      filters (search, topic) itself. Visibility: published and not soft-deleted; a question shows in a
      locale only when its question and answer are both filled in it; a topic only when its name exists
      in the locale and it has at least one such question; a video only when its title exists in the
      locale. Ordered by `sortOrder`, then `id`. An empty FAQ is `200` with empty arrays.
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: The FAQ.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/faq.yaml#/Faq
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

topics:
  get:
    tags: [Faq]
    operationId: listFaqTopicsForPage
    summary: FAQ topics linked to a CMS page
    description: |
      The topics an editor linked to the page, in the order of the link, with the number of questions
      visible in the locale. A topic with none in the locale is left out. The page shows each as a link
      card to the FAQ page (`?topic=<slug>`).
    parameters:
      - name: pageId
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: The linked topics; empty when none.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/faq.yaml#/FaqTopicLink
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
