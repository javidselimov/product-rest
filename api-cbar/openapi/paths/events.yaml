list:
  get:
    tags: [Events]
    operationId: listEvents
    summary: Published events
    description: |
      Only published events with a translation in the locale. There is no `publishedAt` embargo:
      an upcoming event is meant to be public. `when` splits on the Asia/Baku day of the end date
      (the start date for a one-day event), so an event ending today is still upcoming.
      Upcoming and unfiltered lists run oldest first, past events newest first; both then order
      by start time (no time last) and title. `sort=newest` overrides that order (spec 059).
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
      - $ref: ../components/parameters.yaml#/Page
      - name: pageSize
        in: query
        description: Items per page; clamped to 1–500.
        schema:
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 500
      - name: when
        in: query
        description: Omitted = all. Any other value is a 400.
        schema:
          type: string
          enum: [upcoming, past]
      - name: sort
        in: query
        description: |
          `newest`: start date descending, then events with a start time first, later time first,
          then title — past and upcoming together unless `when` is given. Combines with every
          filter and with paging; `total` is unchanged. Omitted = the order described above.
          Blank is the same as omitted (as for `when`); any other value is a 400. The home page calendar sends
          `sort=newest&pageSize=3` (spec 059).
        schema:
          type: string
          enum: [newest]
      - name: q
        in: query
        description: |
          Case-insensitive substring match on the title in `locale`. Trimmed; blank means
          no filter. `%`, `_` and `\` are matched literally. More than 200 characters is a 400.
        schema:
          type: string
          maxLength: 200
      - name: from
        in: query
        description: Keeps events ending on or after this day.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Keeps events starting on or before this day.
        schema:
          type: string
          format: date
      - name: type
        in: query
        schema:
          $ref: ../components/schemas/events.yaml#/EventType
      - name: categoryId
        in: query
        schema:
          type: integer
          format: int32
    responses:
      '200':
        description: One page of events.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventPage
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

bySlug:
  get:
    tags: [Events]
    operationId: getEventBySlug
    summary: Event by slug
    parameters:
      - $ref: ../components/parameters.yaml#/Slug
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: The event with its gallery and linked press release.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventDetail
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

categories:
  get:
    tags: [Events]
    operationId: listEventCategories
    summary: Active event categories
    description: Named in the locale, by sort order. A category without events is included.
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: The categories.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/events.yaml#/EventCategory
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
