media:
  get:
    tags: [Media]
    operationId: getMedia
    summary: Media file bytes
    description: |
      Streams the stored file. Uploads are content-addressed by SHA-256, so the bytes
      behind an id never change: the response is cacheable for a year and the checksum
      is the ETag. No `Content-Length` is sent (legacy rows carry inaccurate sizes), the
      body is chunked. Soft-deleted assets return 404.

      Every file is served with `X-Content-Type-Options: nosniff` and a sandboxing
      `Content-Security-Policy` (the same policy as the admin preview), so an SVG or XML file
      opened directly cannot run script or load anything. Embedding as `<img>` or a CSS
      background is unaffected, and PDFs still open in the browser's viewer.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: If-None-Match
        in: header
        description: ETag from a previous response, or `*`.
        schema:
          type: string
    responses:
      '200':
        description: File bytes with the stored MIME type.
        headers:
          ETag:
            description: Quoted SHA-256 of the content.
            schema:
              type: string
          Cache-Control:
            schema:
              type: string
              const: public, max-age=31536000, immutable
          Content-Disposition:
            description: '`inline` with the original file name.'
            schema:
              type: string
          X-Content-Type-Options:
            schema:
              type: string
              const: nosniff
          Content-Security-Policy:
            schema:
              type: string
              const: default-src 'none'; style-src 'unsafe-inline'; sandbox
        content:
          '*/*':
            schema:
              type: string
              contentMediaType: application/octet-stream
      '304':
        description: '`If-None-Match` matched; no body.'
        headers:
          ETag:
            schema:
              type: string
          Cache-Control:
            schema:
              type: string
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

search:
  get:
    tags: [Search]
    operationId: search
    summary: Site search
    description: |
      Case-insensitive substring search over pages (title + content), press releases,
      laws, money marks (titles) and staff (full name) in the locale. LIKE wildcards
      in `q` are escaped. An empty or blank `q` returns an empty result set.
    parameters:
      - name: q
        in: query
        schema:
          type: string
          default: ''
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: Ranked results.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/search.yaml#/SearchResponse
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

accessibilityWidget:
  get:
    tags: [SiteSettings]
    operationId: getAccessibilityWidget
    summary: Whether the accessibility widget is shown
    description: |
      Reads the `accessibility.widget` setting written by api-cbar-admin. Always 200:
      a missing row or a malformed value means disabled.
    responses:
      '200':
        description: Widget flag.
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

healthz:
  get:
    tags: [Health]
    operationId: healthz
    summary: Liveness and database health
    description: Not rate-limited.
    security: []
    responses:
      '200':
        description: Healthy.
        content:
          text/plain:
            schema:
              type: string
              const: Healthy
      '503':
        description: Unhealthy (database unreachable).
        content:
          text/plain:
            schema:
              type: string
              const: Unhealthy
