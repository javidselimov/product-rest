staff:
  get:
    tags: [Organization]
    operationId: listStaff
    summary: Active staff members
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
      - name: type
        in: query
        schema:
          $ref: ../components/schemas/organization.yaml#/StaffType
    responses:
      '200':
        description: Staff translated into the locale, by sort order.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/organization.yaml#/StaffMember
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

staffMember:
  get:
    tags: [Organization]
    operationId: getStaffMember
    summary: Staff member by id
    parameters:
      - $ref: ../components/parameters.yaml#/IntId
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: Staff member.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/StaffMemberDetail
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

staffPhotosZip:
  get:
    tags: [Organization]
    operationId: downloadStaffPhotos
    summary: All press photos of a staff member as one ZIP
    description: |
      Streams the member's `photos` (same set and order as `GET /api/v1/organization/staff/{id}`)
      as a ZIP archive, one entry per photo named after the asset's original file name
      (`-2`, `-3` suffixes on duplicates). Entries are stored uncompressed — the photos are
      already JPEG/PNG — so the archive is roughly the sum of `sizeBytes`. No `Content-Length`
      (streamed). 404 when the member is inactive/missing or has no photos.
    parameters:
      - $ref: ../components/parameters.yaml#/IntId
    responses:
      '200':
        description: ZIP archive.
        headers:
          Content-Disposition:
            description: '`attachment`; file name `<id>-photos.zip`.'
            schema:
              type: string
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/zip:
            schema:
              type: string
              contentMediaType: application/zip
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

divisions:
  get:
    tags: [Organization]
    operationId: listDivisions
    summary: Active divisions
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: Divisions translated into the locale, by sort order, each with its regulation document of that locale (null when none).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/organization.yaml#/Division
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

offices:
  get:
    tags: [Organization]
    operationId: listOffices
    summary: Active offices
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: Offices translated into the locale, by sort order.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/organization.yaml#/Office
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

chart:
  get:
    tags: [Organization]
    operationId: listOrgChartNodes
    summary: Organisational chart, flat
    description: |
      Active nodes translated into the locale, ordered by `sortOrder`, then id; the client builds
      the tree from `parentId`. A node is left out when it is inactive, when its linked staff
      member or division is inactive, or when it has no name in the locale — and so is its whole
      branch, so every `parentId` refers to a node in the list. Empty when no chart is set up.
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: Chart nodes.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/organization.yaml#/OrgChartNode
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
