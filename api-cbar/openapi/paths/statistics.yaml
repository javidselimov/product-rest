azir:
  get:
    tags: [Statistics]
    operationId: listAzir
    summary: AZIR interbank index values
    description: Unpaged, ordered by value date then term. Without filters returns the full history.
    parameters:
      - name: from
        in: query
        description: Inclusive lower bound, `yyyy-MM-dd`.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive upper bound, `yyyy-MM-dd`.
        schema:
          type: string
          format: date
      - name: term
        in: query
        description: Tenor filter, e.g. `1D`, `1W`, `1M`.
        schema:
          type: string
    responses:
      '200':
        description: Index values.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/statistics.yaml#/AzirValue
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

azirSummary:
  get:
    tags: [Statistics]
    operationId: getAzirSummary
    summary: 1D AZIR summary indicators
    description: |
      The eleven figures of the AZIR page's information block (spec 021). No parameters; an
      empty database answers `200` with every field null.
    responses:
      '200':
        description: The summary.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/statistics.yaml#/AzirSummary
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

inflation:
  get:
    tags: [Statistics]
    operationId: listInflation
    summary: Monthly inflation parameters
    description: Ordered by year, month, parameter code.
    parameters:
      - name: year
        in: query
        schema:
          type: integer
          format: int16
    responses:
      '200':
        description: Parameters.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/statistics.yaml#/InflationParameter
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

inflationSettings:
  get:
    tags: [Statistics]
    operationId: getInflationSettings
    summary: Homepage inflation summary
    responses:
      '200':
        description: Current rate, target and next update date.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/statistics.yaml#/InflationSettings
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

yieldCurveLatest:
  get:
    tags: [Statistics]
    operationId: getLatestYieldCurve
    summary: Most recent yield curve
    description: The latest date that has yield curve points.
    responses:
      '200':
        description: Curve with Nelson-Siegel parameters, observed yields and standard-tenor yields.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/statistics.yaml#/YieldCurve
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

yieldCurveByDate:
  get:
    tags: [Statistics]
    operationId: getYieldCurveByDate
    summary: Yield curve for a date
    parameters:
      - name: date
        in: path
        required: true
        description: |
          Curve date, `yyyy-MM-dd`. The route constraint is `{date:datetime}`, so a value
          that is not a date does not match this route at all (404, not 400).
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Curve for the date. 404 when the date has no points.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/statistics.yaml#/YieldCurve
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
