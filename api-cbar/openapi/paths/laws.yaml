list:
  get:
    tags: [Laws]
    operationId: listLaws
    summary: Published laws and regulations, newest first
    description: Laws without `publishedAt` are included; a future `publishedAt` embargoes the law.
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize
      - name: categoryId
        in: query
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        schema:
          $ref: ../components/schemas/laws.yaml#/LawType
    responses:
      '200':
        description: One page of laws.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/laws.yaml#/LawPage
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

bySlug:
  get:
    tags: [Laws]
    operationId: getLawBySlug
    summary: Law by slug
    parameters:
      - $ref: ../components/parameters.yaml#/Slug
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: Law with its attachments.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/laws.yaml#/LawDetail
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests

categories:
  get:
    tags: [Laws]
    operationId: listLawCategories
    summary: Active law categories
    parameters:
      - $ref: ../components/parameters.yaml#/Locale
    responses:
      '200':
        description: Categories translated into the locale, by sort order.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/common.yaml#/NamedItem
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
