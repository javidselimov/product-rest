# TODO(devops): confirm the hostname and the vault path before the first deploy.
ingress:
  hostname: api-cbar.cbar.az

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_HTTP_PORTS
    value: "8080"
  - name: Logging__LogLevel__Default
    value: "Information"
  - name: TZ
    value: "Asia/Baku"
  # Must match what api-cbar-admin uploads into, or /media/{id} serves 404s.
  - name: MediaStorage__Bucket
    value: "cbar-media-prod"
  # TODO(devops): confirm. Only read when MediaStorage__Endpoint from Vault has no
  # scheme; in-cluster MinIO is plain HTTP, so flip to "true" only if it is behind TLS.
  # Must match api-cbar-admin's value — same MinIO.
  - name: MediaStorage__UseSsl
    value: "false"

# Supplied by Vault, not by this file: ConnectionStrings__Cbar (the SELECT-only
# cbar_web_ro role), ConnectionStrings__Redis, MediaStorage__AccessKey,
# MediaStorage__SecretKey, MediaStorage__Endpoint.
secrets:
  vault:
    secrets:
      api-cbar:
        path: app/cbar-az/api-cbar/prod
        mount: kv

# Requests are reserved on the node at scheduling time whether used or not. Since the
# upgrade from RHEL 8 (cgroup v1 -> v2) the scheduler no longer overcommits them, so 500m left pods
# Pending; real usage is ~12-13%. The limit still lets startup (JIT) burst to 2 CPUs.
resources:
  limits:
    cpu: 2
    memory: 2Gi
  requests:
    cpu: 40m
    memory: 128Mi
