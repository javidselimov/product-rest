# Shared organization npm pipeline (contracts/runtime-config.md §3). DO NOT EDIT —
# project-specific overrides live in `app.gitlab-ci.yml`.
#
# That file sits in the repo root on purpose: the template treats `.ci-cd/` as the helm
# values directory and moves its whole content into the chart
# (`mv -f $CBAR_CICD_SOURCE_VALUES/* $CBAR_CICD_CHART/` in set-env.sh).
#
# Branch -> DEPLOY_ENVIRONMENT (resolved by the template):
#   feature/* | bugfix/* MR -> dev, `test` -> test, `master` -> prod
#
# TODO(devops): confirm `1.0.0` is the current template ref.

include:
  - project: devops-linux-team/ci-cd
    ref: 1.0.0
    file: pipelines/npm.gitlab-ci.yml

  - local: app.gitlab-ci.yml
