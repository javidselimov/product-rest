# This project's CI extension, layered as a local include on top of the organization
# template (devops-linux-team/ci-cd@1.0.0, pipelines/npm.gitlab-ci.yml), which is never edited.
#
# Why: the UI kit (@cbar/lib-react-ui-kit) is an optional dependency served only from the
# internal Nexus, and a plain `npm ci` skips it SILENTLY — the pipeline stays green and dies
# later in the build with an unrelated-looking error. Every install point here goes through
# `npm run install:nexus -- --context=ci`, which verifies the kit is really installed.
#
# Required GitLab variables (Settings -> CI/CD -> Variables): NEXUS_USERNAME, NEXUS_PASSWORD,
# both masked (password >= 8 chars, single line). Set Protected only if the pipeline's branch
# is protected too. Credential VALUES are never written into this file (constitution VIII.3).
#
# TODO(devops): when the template `ref` is bumped, diff the `unit-tests` and `build-image`
# overrides below against the template — a local `script:` replaces the template's COMPLETELY,
# so any step the template adds must be copied here.

variables:
  # Keep in sync with the Dockerfile FROM line.
  NODE_IMAGE: "node:22-alpine"
  # npm cache shared between jobs (cache: .npm/).
  npm_config_cache: ".npm"
  npm_config_fund: "false"
  npm_config_audit: "false"

# The template may default to `GIT_STRATEGY: none`, so jobs needing sources fetch explicitly.
.needs-sources:
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"

# Shared prologue: install every dependency including the kit.
.install:
  extends: .needs-sources
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - node -v && npm -v
    - npm run install:nexus -- --context=ci

# The constitution's article VI.3 gate as a pipeline job. Tests live in `unit-tests` because
# Sonar reads its coverage artifact. `npm audit` is separate from the install (article X.4);
# a Nexus-hosted repo may not implement the audit endpoint, so `--omit=optional` drops the kit.
# Accepted findings: scripts/audit/exceptions.json (D-note: docs/audit-exceptions.md).
app:check:
  image: $NODE_IMAGE
  stage: check
  tags:
    - kubernetes
  extends: .install
  interruptible: true
  script:
    - npm run setup:check
    - npm run lint
    - npm run typecheck
    - npm run build
    - npm run audit -- --omit=optional
  rules:
    - if: $DEPLOY_ENVIRONMENT =~ /^(dev|test|prod)$/

# Override of the template's `unit-tests`, which runs chromium + `npm ci` on `node:20-bookworm`:
# jsdom@30 needs Node >= 22 (Node 20 crashes with `webidl.util.markAsUncloneable is not a
# function`) and vitest needs no browser. Name and stage stay the template's so that
# `sonar-scanning`'s `needs: [unit-tests]` and the coverage artifact keep working.
unit-tests:
  image: $NODE_IMAGE
  tags:
    - kubernetes
  extends: .install
  interruptible: true
  script:
    - npm run test:ci
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - coverage/
  rules:
    - if: $DEPLOY_ENVIRONMENT =~ /^(dev|test|prod)$/

# Override of the template's `build-image`. The runner builds with ROOTLESS BuildKit
# (`buildctl-daemonless.sh`), so `docker:dind` CANNOT work here — and BuildKit supports
# `--secret` natively. Only `script:` is replaced; registry auth, cache, tag and push come from
# `extends: .build-image`. Reason: the Dockerfile's RUN step expects the Nexus credentials as
# `--secret id=nexus_env`, which the template's buildctl call lacks. BuildKit never writes a
# secret into a layer, the cache or `docker history`.
#
# The buildctl call below is the template's plus `--secret`; diff them when the ref is bumped.
# Two details must not change:
#   * `--output ...name=$CI_REGISTRY_IMAGE:$APP_VERSION` — helm deploys exactly this tag
#     (APP_VERSION: dev-<slug> | test | prod-<short-sha>).
#   * `$CBAR_CICD_BUILD_ARGS` — BUILD_ENV comes from `.ci-cd/<env>.yaml` `build.args` via
#     set-env.sh -> pipeline.env. It is not computed here.
build-image:
  extends: .build-image
  interruptible: true
  script:
    # Pre-flight: without credentials `npm ci` skips the kit and the build fails later with a
    # confusing error — stop here with the reason spelled out.
    - test -n "$NEXUS_USERNAME" && test -n "$NEXUS_PASSWORD" || { echo "✗ NEXUS_USERNAME/NEXUS_PASSWORD CI variable-ları boşdur — GitLab → Settings → CI/CD → Variables (dəyişən Protected-dirsə, branch də protected olmalıdır)"; exit 1; }
    - source pipeline.env
    # Secret source: a 0600 temp file in the format the Dockerfile expects; `trap` removes it
    # however the job ends and the values are never printed.
    - |
      umask 077
      trap 'rm -f /tmp/nexus_env' EXIT
      printf 'NEXUS_USERNAME=%s\nNEXUS_PASSWORD=%s\n' "$NEXUS_USERNAME" "$NEXUS_PASSWORD" > /tmp/nexus_env
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --secret id=nexus_env,src=/tmp/nexus_env \
        $CBAR_CICD_BUILD_ARGS \
        --local context=. \
        --local dockerfile=. \
        --export-cache type=registry,ref=$CACHE_IMAGE \
        --import-cache type=registry,ref=$CACHE_IMAGE,mode=max \
        --output type=image,name=$CI_REGISTRY_IMAGE:$APP_VERSION,push=true
  rules:
    - if: $DEPLOY_ENVIRONMENT =~ /^(dev|test|prod)$/
