# SPA hər mühit üçün ayrıca qurulur: BUILD_ENV npm skriptini (build:dev) və uyğun
# .env.dev faylını seçir, VITE_API_URL build zamanı bundle-a yazılır (köhnə
# web-cbar-admin ilə eyni model; runtime /config.json daha yoxdur).
# Bu blok build-in YEGANƏ BUILD_ENV mənbəyidir: set-env.sh onu `--opt build-arg:`
# sətrinə çevirib pipeline.env-ə yazır, build-image job-u oradan oxuyur.
build:
  args:
    BUILD_ENV: dev
# TODO(devops): api-cbar-admin tərəfində `Cors__Origins__0=https://<bu panelin host-u>`
# təyin olunmalıdır — panel deploy-da API-yə cross-origin sorğu göndərir.
