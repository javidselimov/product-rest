# Organization constant: the `project: devops-linux-team/ci-cd` include is identical in
# every repository (shared CI/CD template — quality gate, image build from ./Dockerfile,
# helm deploy driven by .ci-cd/*.yaml). DO NOT TOUCH those lines when adapting the
# template to a new project.
#
# `local: app.gitlab-ci.yml` is this project's own part (spec 004): it overrides the
# template's `unit-tests` and `build-image` jobs so the UI kit can be installed from
# Nexus, and adds the `app:check` gate. The required GitLab variables are listed at the
# top of that file.
#
# That file lives in the repository root on purpose: the template treats `.ci-cd/` as the
# helm values directory and moves everything inside it into the chart
# (`mv -f $CBAR_CICD_SOURCE_VALUES/* $CBAR_CICD_CHART/` in its set-env.sh), so only
# base/dev/test/prod values belong there.
include:
  - project: devops-linux-team/ci-cd
    ref: 1.0.0
    file: pipelines/npm.gitlab-ci.yml

  - local: app.gitlab-ci.yml
