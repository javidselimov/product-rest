server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Single-page app: unknown paths are routed to index.html so client-side
    # routing works on a hard refresh or a shared deep link.
    location / {
        root   /usr/share/nginx/html;
        try_files $uri /index.html;
        index  index.html;
    }

    # index.html names the hashed chunks of one build. A cached copy outlives the
    # deploy and points at chunks that no longer exist, so the browser must
    # revalidate it every time (spec 004, research R1). `location /` falls back
    # to this file for deep links, so they get the header too.
    location = /index.html {
        root       /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        root       /usr/share/nginx/html;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
