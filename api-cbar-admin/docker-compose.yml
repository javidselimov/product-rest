name: cbar-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cbar
      POSTGRES_USER: cbar
      POSTGRES_PASSWORD: cbar_local_dev
    ports:
      - "5433:5432"   # 5432 taken by a native local Postgres (rena project)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbar -d cbar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cbar
      MINIO_ROOT_PASSWORD: cbar_local_dev
    ports:
      - "9002:9000"   # 9000/9001 taken by another local project (rena-minio)
      - "9003:9001"
    volumes:
      - miniodata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: cbar_local_dev_master_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  pgdata:
  miniodata:
  meilidata:
