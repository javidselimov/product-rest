# TODO(devops): confirm the hostname and the vault path before the first deploy.
ingress:
  hostname: api-cbar-admin-test.cbar.az

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Staging"
  - name: ASPNETCORE_HTTP_PORTS
    value: "8080"
  - name: Logging__LogLevel__Default
    value: "Debug"
  - name: TZ
    value: "Asia/Baku"
  # Not a secret, and per-environment: unset, the API falls back to `cbar-media`.
  - name: MediaStorage__Bucket
    value: "cbar-media-test"
  # Only read when MediaStorage__Endpoint from Vault has no scheme, which is the case
  # here: Vault holds "s3.cbar.az:443", so without this the endpoint resolves to
  # http://s3.cbar.az:443 and the TLS listener drops the plaintext request mid-flight
  # ("The response ended prematurely" on every upload).
  - name: MediaStorage__UseSsl
    value: "true"
  # s3.cbar.az runs with a non-default region and advertises it as
  # "x-amz-bucket-region: cbar". It is part of the request signature, so leaving the
  # SDK's "us-east-1" default in place makes MinIO reject every call with a bare 400.
  - name: MediaStorage__Region
    value: "cbar"

# Supplied by Vault, not by this file: ConnectionStrings__Cbar,
# Jwt__SigningKey, MediaStorage__AccessKey, MediaStorage__SecretKey,
# MediaStorage__Endpoint, Cors__Origins__0.
# Cors__Origins__0 must be the panel's exact origin (https://admin-temp.cbar.az):
# CORS allows credentials (refresh cookie, spec 005); other origins get 403 on /auth/refresh|logout.
secrets:
  vault:
    secrets:
      api-cbar-admin:
        path: app/cbar-az/api-cbar-admin/test
        mount: kv

# Requests are reserved on the node at scheduling time whether used or not. Since the
# upgrade from RHEL 8 (cgroup v1 -> v2) the scheduler no longer overcommits them, so 500m left pods
# Pending; real usage is ~12-13%. The limit still lets startup (JIT) burst to 2 CPUs.
resources:
  limits:
    cpu: 2
    memory: 2Gi
  requests:
    cpu: 40m
    memory: 128Mi
