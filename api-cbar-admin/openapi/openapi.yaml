components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/auth/login` or `/refresh`; valid 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: cbar_admin_rt
      description: httpOnly refresh-token cookie set by login/refresh, scoped to `/api/v1/auth`.
