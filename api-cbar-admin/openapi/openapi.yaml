openapi: 3.1.1
info:
  title: cbar.az CMS API (api-cbar-admin)
  version: 1.0.0
  description: |
    Content-management API behind the cbar.az admin panel. Owns the database schema and
    is its only writer; the public site reads the same data through api-cbar.

    Conventions:
    - JSON is camelCase; enums are lowercase strings. Dates are `yyyy-MM-dd`, timestamps
      ISO 8601 with offset.
    - Every route except `/api/v1/auth/*` and `/healthz` needs `Authorization: Bearer <access token>`.
    - Every protected operation also needs a permission (spec 008), named in its `x-permission`
      extension as `<module>.<action>`; a list means any one of them suffices. The `admin` role
      holds every permission; other roles hold what `role_permissions` grants them
      (`GET /api/v1/roles`). Without it the answer is 403 (`Forbidden`), the request changes no
      data, and the refusal is written to the audit log as `authz.denied`. An operation with no
      `x-permission` is open to any authenticated user (`GET /api/v1/me/permissions` only).
    - Translatable items carry `translations: { az?: {...}, en?: {...} }`. On write, a locale
      absent from the map is **deleted**; send every locale you want to keep.
    - Paged lists return `{ items, total, page, pageSize }`; some unpaged lists return
      `{ items }` and some a bare array — each operation says which.
    - Every error is RFC 9457 problem details (`application/problem+json`, schema
      `ProblemDetails`) with a `traceId` for the server log. Business-rule failures and
      database rejections also carry `message` — the text the earlier `{ message }` bodies had
      — and the auth endpoints a `code`. 401, 403 and 5xx without a `message` carry no `title`,
      so clients keep showing their own text. A write the database rejects is 400 or 409
      (`type: urn:cbar:problem:*`), never 500. Any operation may answer `500` (`ServerError`).
    - Not rate-limited.

    Maintained by hand (see `README.md`): the runtime `/openapi/v1.json` has request
    schemas but no response schemas, because the controllers return anonymous types.
    The runtime document is served only in Development and Staging (local, dev, test) —
    not in Production.
  license:
    name: Proprietary
    identifier: LicenseRef-CBAR-Proprietary
  x-known-issues:
    - 'No input validation beyond binding and a few hand checks: an unknown locale key (e.g. `ru`), a string longer than its varchar column, an out-of-range decimal or a non-positive rate are rejected by PostgreSQL and answered 400 without naming the field (field-level validation is #8b).'
    - 'Several PUTs validate the body before looking up the id, so a bad body to a missing id is 400, not 404.'
    - 'Create/update responses omit data that is not loaded: `assets: []` (press releases, laws), `originalName: null` (banners, news slider, publications), `media: null` (MEAS documents). Re-fetch the item.'
    - 'Attachment routes are inconsistent: press releases/laws address by `mediaId` and answer 204; pages by attachment id and galleries by image id, answering 200 with a body.'
    - 'Detach on pages, laws and galleries queries the attachment table directly, so it still works on a soft-deleted parent.'
    - 'Soft-deleted content keeps its attachment rows; `DELETE /media/{id}` therefore answers 409 for files only referenced by deleted content.'
    - '`GET /inflation/settings` answers 204 (no body) until settings are first saved — `Ok(null)` meets the no-content formatter.'
    - '`PUT /pages/{id}` accepts an empty `translations` map (deleting every translation), ignores `parentId: null`, and rejects a changed `parentId` with a stale "Phase 2" message although `/move` exists.'
    - 'Settings are writable by any authenticated user.'
    - 'Users: two admins deactivating, demoting or deleting each other at the same moment can still leave no active admin — the last-admin check and the write are not atomic.'
    - 'Currency codes are matched case-sensitively (`usd` is unknown). `DELETE /currency-rates` without `date` binds `0001-01-01` and answers 404 instead of 400.'
