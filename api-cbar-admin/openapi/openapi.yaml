tags:
  - name: Auth
    description: Sign-in, token refresh (httpOnly cookie) and sign-out.
  - name: Users
    description: CMS user accounts. `admin` role only.
  - name: Settings
    description: Key/value site settings (JSON values).
  - name: Media
    description: File library. Uploads are stored in MinIO, content-addressed by SHA-256.
  - name: Pages
    description: The CMS page tree, page content and per-page attachments.
  - name: PressReleases
    description: Press releases and their attachments.
  - name: Events
    description: Events and their categories.
  - name: CsrProjects
    description: Corporate social responsibility projects, their photos and categories.
  - name: IfiOrganizations
    description: International financial institutions and their membership dates.
  - name: Faq
    description: FAQ topics, questions and videos ("Sual-cavab" section).
  - name: Fincert
    description: FinCERT page — settings, activity directions and international memberships (spec 053).
  - name: Memorandums
    description: Memoranda of understanding with foreign central banks and supervisors.
  - name: MonthlyReports
    description: Monthly reports of the consumer rights pages — complaint indices and infographics (spec 052).
  - name: WorkingPapers
    description: Working papers of the publications and research section (spec 054).
  - name: ReleaseSchedule
    description: Information disclosure schedule — items, groups and periodicities.
  - name: Laws
    description: Legal acts, their categories and attachments.
  - name: MoneyMarks
    description: Banknotes and coins, their categories and related news.
  - name: Meas
    description: MEAS disclosure documents, emitents and information types.
  - name: Organization
    description: Staff (management), structural divisions and regional offices.
  - name: MediaContent
    description: Photo galleries, videos, live video streams and image popups.
  - name: Homepage
    description: Homepage blocks — banners, news slider, links, publications, running lines, info lines.
  - name: Statistics
    description: Currencies, official exchange rates, AZIR, inflation and yield curves.
  - name: Access
    description: Roles, permissions and the audit log (spec 008).
  - name: Health
    description: Liveness/readiness probe.

