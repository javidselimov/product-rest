# Staff (management), structural divisions and regional offices.
# Source: Controllers/OrganizationController.cs, Entities/Organization.cs.

# --- Staff -------------------------------------------------------------------

OrganizationStaffTranslation:
  type: object
  required: [fullName, position, receptionDays, bio]
  properties:
    fullName:
      type: string
    position:
      type: [string, 'null']
    receptionDays:
      type: [string, 'null']
      description: Free text, e.g. the weekdays/hours the person receives citizens.
    bio:
      type: [string, 'null']
      description: HTML.

OrganizationStaffPhoto:
  description: |
    One press photo of a staff member (the downloadable set shown under the biography on the
    public site). `id` is the staff-photo id used by the `/photos/…` routes, not the media id.
  type: object
  required: [id, mediaId, originalName, sortOrder]
  properties:
    id:
      type: integer
      format: int64
    mediaId:
      type: integer
      format: int64
    originalName:
      type: [string, 'null']
      description: The media asset's original file name.
    sortOrder:
      type: integer
      format: int32

OrganizationStaffPhotoAttached:
  description: The newly created staff photo.
  type: object
  required: [id, mediaId, sortOrder]
  properties:
    id:
      type: integer
      format: int64
      description: Staff-photo id (for detach and reorder).
    mediaId:
      type: integer
      format: int64
    sortOrder:
      type: integer
      format: int32

OrganizationStaffPhotoOrder:
  type: object
  required: [photoIds]
  properties:
    photoIds:
      type: array
      description: |
        Every staff-photo id (`photos[].id`, not media ids) of the member, exactly once, in the
        new order. `sortOrder` is rewritten as 1, 2, 3, … in this order.
      uniqueItems: true
      items:
        type: integer
        format: int64

OrganizationStaff:
  type: object
  required: [id, type, sortOrder, isActive, phone, photoMediaId, updatedAt, translations, photos]
  properties:
    id:
      type: integer
      format: int32
    type:
      type: integer
      format: int16
      description: '`1` = board, `2` = director general, `3` = adviser to the Governor (2 and 3 make up the public "Management" page).'
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    phone:
      type: [string, 'null']
    photoMediaId:
      type: [integer, 'null']
      format: int64
      description: Id of the photo's `media_assets` row. Becomes null if that asset is deleted.
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrganizationStaffTranslation'
    photos:
      type: array
      description: Press photos in `sortOrder`. Managed through the `/photos` sub-resource, not the upsert body.
      items:
        $ref: '#/OrganizationStaffPhoto'

OrganizationStaffTranslationInput:
  type: object
  required: [fullName]
  properties:
    fullName:
      type: string
    position:
      type: [string, 'null']
    receptionDays:
      type: [string, 'null']
    bio:
      type: [string, 'null']

OrganizationStaffUpsert:
  type: object
  required: [type, sortOrder, isActive, translations]
  properties:
    type:
      type: integer
      format: int16
      description: '`1` = board, `2` = director general, `3` = adviser to the Governor. Not validated against that list.'
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    phone:
      type: [string, 'null']
    photoMediaId:
      type: [integer, 'null']
      format: int64
      description: Id of an existing `media_assets` row (`POST /api/v1/media` first); null for no photo.
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      minProperties: 1
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrganizationStaffTranslationInput'

# --- Divisions ---------------------------------------------------------------

OrganizationDivisionTranslation:
  type: object
  required: [name, description, regulationMediaId, regulationName]
  properties:
    name:
      type: string
    description:
      type: [string, 'null']
      description: HTML.
    regulationMediaId:
      type: [integer, 'null']
      format: int64
      description: Media asset of the division regulation ("Əsasnamə") in this locale, usually a PDF; shown as a file row on the public department page.
    regulationName:
      type: [string, 'null']
      description: Original file name of `regulationMediaId`; null when no regulation is attached.

OrganizationDivision:
  type: object
  required: [id, sortOrder, isActive, mediaId, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    mediaId:
      type: [integer, 'null']
      format: int64
      description: Id of the attached `media_assets` row. Becomes null if that asset is deleted.
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrganizationDivisionTranslation'

OrganizationDivisionTranslationInput:
  type: object
  required: [name]
  properties:
    name:
      type: string
    description:
      type: [string, 'null']
    regulationMediaId:
      type: [integer, 'null']
      format: int64
      description: Must reference an existing media asset (400 otherwise).

OrganizationDivisionUpsert:
  type: object
  required: [sortOrder, isActive, translations]
  properties:
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    mediaId:
      type: [integer, 'null']
      format: int64
      description: Id of an existing `media_assets` row (`POST /api/v1/media` first); null for none.
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      minProperties: 1
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrganizationDivisionTranslationInput'

# --- Offices -----------------------------------------------------------------

OrganizationOfficeTranslation:
  type: object
  required: [name, address, phone, directorName, regulationMediaId, regulationName]
  properties:
    name:
      type: string
    address:
      type: [string, 'null']
    phone:
      type: [string, 'null']
    directorName:
      type: [string, 'null']
      description: Head of the office, shown under "Rəhbər" on the public card.
    regulationMediaId:
      type: [integer, 'null']
      format: int64
      description: Media asset of the office regulation ("Əsasnamə") in this locale, usually a PDF.
    regulationName:
      type: [string, 'null']
      description: Original file name of `regulationMediaId`; null when no regulation is attached.

OrganizationOffice:
  type: object
  required: [id, sortOrder, isActive, photoMediaId, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    photoMediaId:
      type: [integer, 'null']
      format: int64
      description: Photo of the office building shown on the public card.
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrganizationOfficeTranslation'

OrganizationOfficeTranslationInput:
  type: object
  required: [name]
  properties:
    name:
      type: string
    address:
      type: [string, 'null']
    phone:
      type: [string, 'null']
    directorName:
      type: [string, 'null']
    regulationMediaId:
      type: [integer, 'null']
      format: int64
      description: Must reference an existing media asset (400 otherwise).

OrganizationOfficeUpsert:
  type: object
  required: [sortOrder, isActive, translations]
  properties:
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    photoMediaId:
      type: [integer, 'null']
      format: int64
      description: Must reference an existing media asset (400 otherwise).
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      minProperties: 1
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrganizationOfficeTranslationInput'

# --- Organisational chart ----------------------------------------------------

OrgChartKind:
  type: integer
  format: int16
  description: |
    Card style and role in the chart: `1` = governor, `2` = deputy governor, `3` = director
    general, `4` = block, `5` = department, `6` = group (a labelled frame around its children,
    e.g. "Təşkilati inkişaf bloku"). Values outside 1–6 are rejected (400).
  enum: [1, 2, 3, 4, 5, 6]

OrgChartLayout:
  deprecated: true
  description: |
    Deprecated since spec 060: kept for a rollback, read by no client.

    Desktop position of the card on the chart canvas, in CSS pixels of a 984 px wide canvas
    whose origin is its top-left corner. Tablet and mobile ignore it (they stack the tree).
  type: object
  required: [x, y, w, h]
  properties:
    x:
      type: number
      minimum: 0
    y:
      type: number
      minimum: 0
    w:
      type: number
      exclusiveMinimum: 0
    h:
      type: number
      exclusiveMinimum: 0

OrgChartConnector:
  deprecated: true
  description: |
    Deprecated since spec 060: kept for a rollback, read by no client.

    Hand-drawn line from the parent to this card as canvas points `[x, y]`, drawn as a
    polyline in order. Null draws the automatic elbow line (parent bottom-centre → shared
    horizontal bus → child top-centre).
  type: [array, 'null']
  minItems: 2
  items:
    type: array
    minItems: 2
    maxItems: 2
    items:
      type: number

OrgChartNodeTranslation:
  type: object
  required: [title, subtitle]
  properties:
    title:
      type: [string, 'null']
      description: Overrides the linked record's name; null shows that name.
    subtitle:
      type: [string, 'null']
      description: Overrides the linked staff member's position; null shows that position.

OrgChartLinkedTranslation:
  type: object
  required: [name, role]
  properties:
    name:
      type: string
      description: Staff `fullName` or division `name`.
    role:
      type: [string, 'null']
      description: Staff `position`; always null for a division.

OrgChartNode:
  type: object
  required: [id, parentId, kind, staffId, divisionId, curatorDirect, sortOrder, isActive, departmentsOpen, layout, connector, updatedAt, translations, linked]
  properties:
    id:
      type: integer
      format: int32
    parentId:
      type: [integer, 'null']
      format: int32
      description: Null for a root (the governor).
    kind:
      $ref: '#/OrgChartKind'
    staffId:
      type: [integer, 'null']
      format: int32
      description: Linked staff member; the public card links to its page. Becomes null if the member is deleted.
    divisionId:
      type: [integer, 'null']
      format: int32
      description: Linked division; the public card links to its page. Becomes null if the division is deleted.
    curatorDirect:
      type: boolean
      description: Directly subordinate to the curator — the public card adds `*` and the chart shows the footnote.
    sortOrder:
      type: integer
      format: int32
      description: Order among siblings (the desktop chart, tablet/mobile stacking and the admin tree).
    isActive:
      type: boolean
    departmentsOpen:
      type: boolean
      description: |
        A block or group shows its departments always open on the desktop chart instead of as a
        dropdown (spec 060). False when never set.
    layout:
      anyOf:
        - $ref: '#/OrgChartLayout'
        - type: 'null'
      deprecated: true
      description: Deprecated since spec 060. Null until the node was placed on the old desktop canvas.
    connector:
      $ref: '#/OrgChartConnector'
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → override texts; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrgChartNodeTranslation'
    linked:
      type: object
      description: |
        Locale → name/role of the linked staff member or division, for previewing what the
        public card shows where no override is set. Empty when nothing is linked.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrgChartLinkedTranslation'

OrgChartNodeTranslationInput:
  type: object
  properties:
    title:
      type: [string, 'null']
      maxLength: 500
    subtitle:
      type: [string, 'null']
      maxLength: 500

OrgChartNodeUpsert:
  type: object
  required: [kind, curatorDirect, sortOrder, isActive, translations]
  properties:
    parentId:
      type: [integer, 'null']
      format: int32
      description: Must reference an existing node (400 otherwise); null for a root.
    kind:
      $ref: '#/OrgChartKind'
    staffId:
      type: [integer, 'null']
      format: int32
      description: Must reference an existing staff member (400). Not together with `divisionId` (400).
    divisionId:
      type: [integer, 'null']
      format: int32
      description: Must reference an existing division (400). Not together with `staffId` (400).
    curatorDirect:
      type: boolean
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    departmentsOpen:
      type: [boolean, 'null']
      description: |
        Block (4) or group (6) only: true shows its departments always open on the desktop chart.
        True for another kind is rejected (400). Omitted or null keeps the stored value (false
        for a new node).
    translations:
      type: object
      description: |
        Locale → override texts. May be empty for a linked node; a node with neither
        `staffId` nor `divisionId` needs a `title` in at least one locale (400).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/OrgChartNodeTranslationInput'

OrgChartLayoutItem:
  type: object
  required: [id, layout, connector]
  properties:
    id:
      type: integer
      format: int32
    layout:
      anyOf:
        - $ref: '#/OrgChartLayout'
        - type: 'null'
      description: Null takes the node off the desktop canvas.
    connector:
      $ref: '#/OrgChartConnector'

OrgChartOrder:
  type: object
  required: [parentId, ids]
  properties:
    parentId:
      type: [integer, 'null']
      format: int32
      description: The node whose children are reordered; null for the roots. Unknown id → 404.
    ids:
      type: array
      description: Every child of `parentId`, inactive ones included, each once, in the new order.
      items:
        type: integer
        format: int32

OrgChartLayoutUpdate:
  type: object
  required: [items]
  properties:
    items:
      type: array
      minItems: 1
      items:
        $ref: '#/OrgChartLayoutItem'
