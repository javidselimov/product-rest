# --- Info lines ------------------------------------------------------------

InfoLineTranslation:
  type: object
  required: [title, value]
  properties:
    title:
      type: string
    value:
      type: [string, 'null']

InfoLine:
  type: object
  required: [id, alias, year, sortOrder, isActive, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    alias:
      type: string
      description: Block identifier; lines with the same alias form one block.
    year:
      type: [integer, 'null']
      format: int16
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/InfoLineTranslation'

InfoLineGroup:
  type: object
  required: [alias, lines]
  properties:
    alias:
      type: string
    lines:
      type: array
      description: Year descending, then `sortOrder`.
      items:
        $ref: '#/InfoLine'

InfoLinePage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      description: |
        Paging is applied to **lines**, then the page's lines are grouped by alias. `total`
        counts lines, not groups, and one alias can be split across two pages.
      properties:
        items:
          type: array
          description: One group per alias present on this page, alias ascending.
          items:
            $ref: '#/InfoLineGroup'

InfoLineUpsert:
  type: object
  required: [alias, sortOrder, isActive, translations]
  properties:
    alias:
      type: string
      description: Must not be blank.
    year:
      type: [integer, 'null']
      format: int16
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation. At least one is required.
      minProperties: 1
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/InfoLineTranslation'

# --- Strategy documents (spec 057) ------------------------------------------------

StrategyDocOrder:
  type: object
  required: [ids]
  properties:
    ids:
      type: array
      description: Every non-deleted document exactly once, in the new order.
      items:
        type: integer
        format: int32

StrategyDocFieldProblem:
  description: |
    A field was rejected by the controller. `message` is the first failure; `errors` maps each failing field (camelCase
    body path: `status`, `pageId`, `translations.az.title`, `translations.en.url`, `translations.az.coverMediaId` …) to
    its messages.
  allOf:
    - $ref: ./common.yaml#/ErrorMessage
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

StrategyDocTranslationInput:
  type: object
  properties:
    title:
      type: [string, 'null']
      maxLength: 300
      description: A locale without a title is not stored.
    summary:
      type: [string, 'null']
      maxLength: 500
      description: Shown on the narrow cards only.
    coverMediaId:
      type: [integer, 'null']
      format: int64
      description: An existing, non-deleted image (`image/*`).
    url:
      type: [string, 'null']
      maxLength: 1000
      description: |
        Empty, an absolute `http://` / `https://` URL or a site path starting with `/` (not `//`). Wins over the page in
        this locale.

StrategyDocUpsert:
  type: object
  required: [status, translations]
  properties:
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`published` or `draft`; `scheduled` and `archived` are refused."
    pageId:
      type: [integer, 'null']
      format: int32
      description: The CMS page the card opens where a locale has no `url`. Either a page or a titled locale with a `url`.
    translations:
      type: object
      minProperties: 1
      description: At least one locale with a title; a locale left out or without a title is removed.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/StrategyDocTranslationInput'

StrategyDocTranslation:
  type: object
  required: [title, summary, url, coverMediaId, cover]
  properties:
    title:
      type: string
    summary:
      type: [string, 'null']
    url:
      type: [string, 'null']
    coverMediaId:
      type: [integer, 'null']
      format: int64
    cover:
      description: Null without a cover or when its file is deleted.
      oneOf:
        - $ref: ./common.yaml#/AssetRef
        - type: 'null'

StrategyDocDetail:
  type: object
  required: [id, sortOrder, status, pageId, page, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    pageId:
      type: [integer, 'null']
      format: int32
    page:
      description: The linked page with its az title (else en); null without a page or when the page is deleted.
      oneOf:
        - type: object
          required: [id, title]
          properties:
            id:
              type: integer
              format: int32
            title:
              type: [string, 'null']
        - type: 'null'
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/StrategyDocTranslation'

StrategyDocListItem:
  type: object
  required: [id, sortOrder, status, title, pageId, pageTitle, urls, cover, locales, linkBroken, updatedAt]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    title:
      type: [string, 'null']
      description: The az title, else the en one.
    pageId:
      type: [integer, 'null']
      format: int32
    pageTitle:
      type: [string, 'null']
      description: The az title of the linked page (else en); null without a page.
    urls:
      type: object
      description: The `url` of each locale that has one.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        type: string
    cover:
      description: The az cover, else the en one; null without a cover.
      oneOf:
        - $ref: ./common.yaml#/AssetRef
        - type: 'null'
    locales:
      type: array
      description: Locales with a title.
      items:
        $ref: ./common.yaml#/Locale
    linkBroken:
      type: boolean
      description: |
        No titled locale has a working link: neither a `url` nor a linked page the public site shows in that locale
        (published, active, shown in the locale, with a slug).
    updatedAt:
      $ref: ./common.yaml#/DateTime

StrategyDocPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/StrategyDocListItem'
