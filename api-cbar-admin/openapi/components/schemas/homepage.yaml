# Homepage blocks: banners, news slider, homepage links, homepage publications,
# running lines, info lines.

# --- Banners ---------------------------------------------------------------

BannerTranslation:
  type: object
  required: [title, link]
  properties:
    title:
      type: [string, 'null']
    link:
      type: [string, 'null']

Banner:
  type: object
  required: [id, mediaId, originalName, sortOrder, isActive, startsAt, endsAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    mediaId:
      type: [integer, 'null']
      format: int64
    originalName:
      type: [string, 'null']
      description: |
        The image's original file name. Null when there is no image — and always null in
        the create/update responses (the media row is not loaded there).
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    startsAt:
      $ref: ./common.yaml#/NullableDateTime
    endsAt:
      $ref: ./common.yaml#/NullableDateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/BannerTranslation'

BannerList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Banner'

BannerTranslationInput:
  type: object
  description: Both fields are optional; an entry may be empty.
  properties:
    title:
      type: [string, 'null']
    link:
      type: [string, 'null']

BannerUpsert:
  type: object
  required: [sortOrder, isActive, translations]
  properties:
    mediaId:
      type: [integer, 'null']
      format: int64
      description: Id of an existing `media_assets` row.
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    startsAt:
      $ref: ./common.yaml#/NullableDateTime
    endsAt:
      $ref: ./common.yaml#/NullableDateTime
    translations:
      type: object
      description: |
        Locale → translation. May be empty only when `mediaId` is set (a banner needs an
        image or at least one translation).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/BannerTranslationInput'

