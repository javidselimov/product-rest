MonthlyReportSeriesKey:
  type: string
  description: Stable series key, the same in every environment.
  examples: [bank-complaint-index, insurance-complaint-index, infographics]

MonthlyReportSeriesItem:
  type: object
  required: [key, name, nameEn, periodMonths]
  properties:
    key:
      $ref: '#/MonthlyReportSeriesKey'
    name:
      type: string
      description: The az name; with the period it is the title of every report of the series.
    nameEn:
      type: [string, 'null']
    periodMonths:
      type: integer
      format: int16
      minimum: 1
      maximum: 12
      description: A report covers this many months ending with its own month (12 for the insurance index).

MonthlyReportListItem:
  type: object
  required: [id, series, seriesName, periodMonths, year, month, status, locales, missingFile, updatedAt]
  properties:
    id:
      type: integer
      format: int32
    series:
      $ref: '#/MonthlyReportSeriesKey'
    seriesName:
      type: string
      description: The series' az name.
    periodMonths:
      type: integer
      format: int16
    year:
      type: integer
      format: int16
    month:
      type: integer
      format: int16
      minimum: 1
      maximum: 12
    status:
      $ref: ./common.yaml#/ContentStatus
    locales:
      type: array
      description: Locales that have a file.
      items:
        type: string
    missingFile:
      type: boolean
      description: A locale's file was deleted from the media library, so the report does not show in that locale.
    updatedAt:
      type: string
      format: date-time

MonthlyReportPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/MonthlyReportListItem'

MonthlyReportFileInput:
  type: object
  required: [mediaId]
  properties:
    mediaId:
      type: integer
      format: int64
      description: A media library file that exists and is not deleted.

MonthlyReportFile:
  type: object
  required: [mediaId, mediaName]
  properties:
    mediaId:
      type: integer
      format: int64
    mediaName:
      type: [string, 'null']
      description: The file's original name; `null` when the file was deleted from the media library.

MonthlyReportUpsert:
  type: object
  required: [series, year, month, status, translations]
  properties:
    series:
      $ref: '#/MonthlyReportSeriesKey'
    year:
      type: integer
      format: int16
      minimum: 2000
      description: At most next year.
    month:
      type: integer
      format: int16
      minimum: 1
      maximum: 12
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused: a report has no planned publication."
    translations:
      type: object
      minProperties: 1
      description: The file of each locale; at least one. A locale left out does not show on the site.
      additionalProperties:
        $ref: '#/MonthlyReportFileInput'

MonthlyReportDetail:
  type: object
  required: [id, series, year, month, status, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    series:
      $ref: '#/MonthlyReportSeriesKey'
    year:
      type: integer
      format: int16
    month:
      type: integer
      format: int16
    status:
      $ref: ./common.yaml#/ContentStatus
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    translations:
      type: object
      additionalProperties:
        $ref: '#/MonthlyReportFile'
