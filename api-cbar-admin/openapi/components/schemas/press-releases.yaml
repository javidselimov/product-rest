PressReleaseListItem:
  type: object
  required: [id, type, status, publishedAt, updatedAt, title]
  properties:
    id:
      type: integer
      format: int32
    type:
      type: integer
      format: int16
      description: "`1` news, `2` announcement, `3` interview or speech."
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    title:
      type: [string, 'null']
      description: The az title, else any locale's; null only if the item has no translations.

PressReleasePage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/PressReleaseListItem'

PressReleaseTranslation:
  type: object
  required: [title, slug, content]
  properties:
    title:
      type: string
    slug:
      type: string
    content:
      type: [string, 'null']
      description: HTML.

PressReleaseDetail:
  type: object
  required: [id, type, status, publishedAt, updatedAt, translations, assets]
  properties:
    id:
      type: integer
      format: int32
    type:
      type: integer
      format: int16
      description: "`1` news, `2` announcement, `3` interview or speech."
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/PressReleaseTranslation'
    assets:
      type: array
      items:
        $ref: '#/PressReleaseAssetRef'

PressReleaseTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
    content:
      type: [string, 'null']

PressReleaseUpsert:
  type: object
  required: [status, translations]
  properties:
    type:
      type: [integer, 'null']
      format: int16
      enum: [1, 2, 3, null]
      description: |
        `1` news, `2` announcement, `3` interview or speech. Omitted or null: create stores `1`, update keeps the stored
        type. Any other value is a 400 with `message` (before spec 029 an omitted type was
        silently stored as 0 and the item vanished from both public lists).
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    translations:
      type: object
      description: Locale → translation. Create requires at least one.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/PressReleaseTranslationInput'

PressReleaseAssetRef:
  allOf:
    - $ref: ./common.yaml#/AssetRef
    - type: object
      required: [locale]
      properties:
        locale:
          type: [string, 'null']
          enum: [az, en, null]
          description: |
            The language this file is shown in on the public site; null means both. The public
            API leaves out attachments of the other language.

PressReleaseAssetLocale:
  type: object
  required: [locale]
  properties:
    locale:
      type: [string, 'null']
      enum: [az, en, null]
      description: The file's language; null shows it in both languages.

PressReleaseAssetOrder:
  type: object
  required: [mediaIds]
  properties:
    mediaIds:
      type: array
      description: |
        Every attached media id (`assets[].mediaId`) of the press release, exactly once, in
        the new order. `sortOrder` is rewritten as 1, 2, 3, … in this order. On the public
        site the first image attachment is the cover and the remaining images form the
        photo gallery; non-image files are listed as documents. Interviews and speeches
        (`type` 3) use the first image for the list card only, and the first PDF of a
        language is the download button of that language.
      uniqueItems: true
      items:
        type: integer
        format: int64
