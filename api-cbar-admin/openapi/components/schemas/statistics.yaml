# Currencies, official exchange rates, AZIR, inflation and yield curves.
# Decimals are serialised as JSON numbers carrying the column's scale (a `numeric(12,4)`
# rate of 1.7 comes back as `1.7000`). A value outside the column's precision is not
# validated by the controller: PostgreSQL rejects it and the request fails with 500.

# --- Currencies ---------------------------------------------------------------

Currency:
  type: object
  required: [code, nominal, sortOrder, isActive, showOnHomepage, nameAz, nameEn]
  properties:
    code:
      type: string
      description: ISO 4217 code (`char(3)`), e.g. `USD`.
    nominal:
      type: integer
      format: int32
      description: Units the rate is quoted for (e.g. 100 for JPY).
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    showOnHomepage:
      type: boolean
      description: Whether the currency appears on the public homepage rate card.
    nameAz:
      type: [string, 'null']
      description: Null when the currency has no az translation.
    nameEn:
      type: [string, 'null']
      description: Null when the currency has no en translation.

CurrencyList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Currency'

CurrencyUpdate:
  type: object
  required: [showOnHomepage, sortOrder, isActive]
  properties:
    showOnHomepage:
      type: boolean
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean

# --- Currency rates -----------------------------------------------------------

CurrencyRate:
  type: object
  required: [currencyCode, nominal, nameAz, rate]
  properties:
    currencyCode:
      type: string
    nominal:
      type: integer
      format: int32
    nameAz:
      type: [string, 'null']
      description: The currency's az name; null when it has none.
    rate:
      type: number
      description: AZN per `nominal` units; `numeric(12,4)`.

CurrencyRateSheet:
  type: object
  required: [date, rates]
  properties:
    date:
      $ref: ./common.yaml#/NullableDate
      description: The sheet's date; null only when no rates exist at all.
    rates:
      type: array
      description: Ordered by the currency's `sortOrder`, then code. Empty when the date has no rates.
      items:
        $ref: '#/CurrencyRate'

CurrencyRateDate:
  type: object
  required: [date, count]
  properties:
    date:
      $ref: ./common.yaml#/Date
    count:
      type: integer
      format: int32
      description: Number of currency rates stored for the date.

CurrencyRateDatePage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/CurrencyRateDate'

CurrencyRateItemInput:
  type: object
  required: [currencyCode, rate]
  properties:
    currencyCode:
      type: string
      description: Must be a known currency code; compared case-sensitively.
    rate:
      type: number
      exclusiveMinimum: 0
      description: |
        `numeric(12,4)`. Not validated by the controller; a value `<= 0` violates a
        database check and fails with 400 `urn:cbar:problem:value-rejected`.

CurrencyRateSheetUpsert:
  type: object
  required: [date, rates]
  properties:
    date:
      $ref: ./common.yaml#/Date
    rates:
      type: array
      minItems: 1
      description: At least one entry; each currency code at most once.
      items:
        $ref: '#/CurrencyRateItemInput'

CurrencyRateImportForm:
  type: object
  required: [date, file]
  properties:
    date:
      $ref: ./common.yaml#/Date
      description: The sheet's date. The bulletin's own date cell (`C2`) is not read.
    file:
      type: string
      contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      description: |
        The official rate bulletin, `.xlsx` only (content must start with `PK\3\4`), at most
        5 MB (5 242 880 bytes). The active sheet's `B7:G100` is read: column `B` is the
        currency code, column `G` the rate. The file is not stored.
    overwrite:
      type: boolean
      default: false
      description: |
        Must be `true` to import into a date that already has rates; without it such a request
        is answered with 409 `sheet_exists`.

CurrencyRateImportResult:
  type: object
  required: [date, imported, skipped, rates]
  properties:
    date:
      $ref: ./common.yaml#/Date
    imported:
      type: integer
      format: int32
      description: Number of currency rates written (inserted or updated).
    skipped:
      type: array
      description: Codes in the file that are not in the currency master, in file order, each once.
      items:
        type: string
    rates:
      type: array
      description: The rates written, in file order; `XDR` is already mapped to `SDR`.
      items:
        $ref: '#/CurrencyRateImportItem'

CurrencyRateImportItem:
  type: object
  required: [currencyCode, rate]
  properties:
    currencyCode:
      type: string
    rate:
      type: number
      description: Rounded to 4 decimals, half away from zero, as the legacy importer did.

CurrencyRateImportProblem:
  description: |
    A rejected import. `code` names the reason; `row` and `currency` locate a bad line
    (`invalid_rate`, `duplicate_code`), `skipped` lists unknown codes (`no_rates`), `count` the
    rates already stored for the date (`sheet_exists`). Nothing is written when an import fails.
  allOf:
    - $ref: ./common.yaml#/ErrorMessage
    - type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [date_required, file_required, not_xlsx, file_too_large, no_rates, invalid_rate,
            duplicate_code, sheet_exists]
        row:
          type: integer
          format: int32
          description: Spreadsheet row number (7–100).
        currency:
          type: string
        skipped:
          type: array
          items:
            type: string
        count:
          type: integer
          format: int32

# --- AZIR ---------------------------------------------------------------------

AzirValue:
  type: object
  required: [id, valueDate, term, rate, dealVolume, dealCount, minRate, maxRate, isReservePlan, updatedAt]
  properties:
    id:
      type: integer
      format: int64
    valueDate:
      $ref: ./common.yaml#/Date
    term:
      type: string
      description: Tenor — `1D`, `30D`, `90D` or `180D` in practice; any string up to 10 characters is accepted.
    rate:
      type: number
      description: '`numeric(8,4)`.'
    dealVolume:
      $ref: '#/AzirDealVolume'
    dealCount:
      $ref: '#/AzirDealCount'
    minRate:
      $ref: '#/AzirMinRate'
    maxRate:
      $ref: '#/AzirMaxRate'
    isReservePlan:
      $ref: '#/AzirIsReservePlan'
    updatedAt:
      $ref: ./common.yaml#/DateTime
      description: Also moves when only the deal details change.

# The deal details live in `azir_index_value_details` (migration 0008); a value without a
# details row reads as nulls and `isReservePlan: false`.
AzirDealVolume:
  type: [number, 'null']
  description: Value of transactions, mln AZN — `numeric(12,2)`, zero or positive.
AzirDealCount:
  type: [integer, 'null']
  format: int32
  description: Number of transactions, zero or positive.
AzirMinRate:
  type: [number, 'null']
  description: Minimum rate on the last transaction day — `numeric(8,4)`, zero or positive.
AzirMaxRate:
  type: [number, 'null']
  description: Maximum rate on the last transaction day — `numeric(8,4)`, not below `minRate`.
AzirIsReservePlan:
  type: boolean
  description: The index was calculated under the contingency (reserve) plan; shown as `*`.

AzirValuePage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/AzirValue'

AzirValueSaved:
  description: Upsert result — like `AzirValue` but without `updatedAt`.
  type: object
  required: [id, valueDate, term, rate, dealVolume, dealCount, minRate, maxRate, isReservePlan]
  properties:
    id:
      type: integer
      format: int64
    valueDate:
      $ref: ./common.yaml#/Date
    term:
      type: string
    rate:
      type: number
    dealVolume:
      $ref: '#/AzirDealVolume'
    dealCount:
      $ref: '#/AzirDealCount'
    minRate:
      $ref: '#/AzirMinRate'
    maxRate:
      $ref: '#/AzirMaxRate'
    isReservePlan:
      $ref: '#/AzirIsReservePlan'

AzirUpsert:
  description: |
    A full replacement of the editable fields: an omitted nullable field is stored as null and
    an omitted `isReservePlan` as false, also when the value already exists.
  type: object
  required: [valueDate, term, rate]
  properties:
    valueDate:
      $ref: ./common.yaml#/Date
    term:
      type: string
      maxLength: 10
      description: Must not be blank or longer than 10 characters.
    rate:
      type: number
      description: '`numeric(8,4)` — zero or positive, below 10000, at most 4 decimals.'
    dealVolume:
      type: [number, 'null']
      description: mln AZN — zero or positive, below 10^10, at most 2 decimals.
    dealCount:
      type: [integer, 'null']
      format: int32
      minimum: 0
    minRate:
      type: [number, 'null']
      description: Zero or positive, below 10000, at most 4 decimals; not above `maxRate`.
    maxRate:
      type: [number, 'null']
      description: Zero or positive, below 10000, at most 4 decimals.
    isReservePlan:
      type: boolean
      default: false

AzirValidationProblem:
  description: |
    The upsert was rejected by the controller. `message` is the first failure; `errors` maps
    each failing field (camelCase body name) to its messages.
  allOf:
    - $ref: ./common.yaml#/ErrorMessage
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

# --- Inflation ----------------------------------------------------------------

InflationParameter:
  type: object
  required: [id, year, month, parameterCode, value, updatedAt]
  properties:
    id:
      type: integer
      format: int32
    year:
      type: integer
      format: int16
    month:
      type: integer
      format: int16
      minimum: 1
      maximum: 12
    parameterCode:
      type: string
      description: E.g. `cpi_yoy`, `cpi_mom`.
    value:
      type: number
      description: '`numeric(10,4)`.'
    updatedAt:
      $ref: ./common.yaml#/DateTime

InflationParameterSaved:
  description: Upsert result — like `InflationParameter` but without `updatedAt`.
  type: object
  required: [id, year, month, parameterCode, value]
  properties:
    id:
      type: integer
      format: int32
    year:
      type: integer
      format: int16
    month:
      type: integer
      format: int16
    parameterCode:
      type: string
    value:
      type: number

InflationParameterUpsert:
  type: object
  required: [year, month, parameterCode, value]
  properties:
    year:
      type: integer
      format: int16
    month:
      type: integer
      format: int16
      minimum: 1
      maximum: 12
    parameterCode:
      type: string
      maxLength: 50
      description: Must not be blank. Longer than 50 characters fails in the database (500).
    value:
      type: number
      description: '`numeric(10,4)` — absolute value below 1000000.'

InflationSettings:
  description: The homepage inflation summary (a single row).
  type: object
  required: [currentInflation, targetInflation, nextUpdateDate, updatedAt]
  properties:
    currentInflation:
      type: number
      description: Percent; `numeric(6,2)`.
    targetInflation:
      type: string
      description: Free text, e.g. `4 (±2)`.
    nextUpdateDate:
      $ref: ./common.yaml#/Date
    updatedAt:
      $ref: ./common.yaml#/DateTime

InflationSettingsUpdate:
  type: object
  required: [currentInflation, targetInflation, nextUpdateDate]
  properties:
    currentInflation:
      type: number
      exclusiveMinimum: -10000
      exclusiveMaximum: 10000
      description: Stored as `numeric(6,2)` (rounded to 2 decimals).
    targetInflation:
      type: string
      minLength: 1
      maxLength: 255
      description: Trimmed before storing; must not be blank; at most 255 characters after trimming.
    nextUpdateDate:
      $ref: ./common.yaml#/Date

# --- Yield curves -------------------------------------------------------------
# Three independent date-keyed datasets, as in the legacy admin (YCYields, YCParams, YCPeriods):
# each is imported from its own .xlsx and deleted by date on its own.

YieldCurveImportForm:
  type: object
  required: [date, file]
  properties:
    date:
      $ref: ./common.yaml#/Date
      description: The date the data is stored under. The file's own date column (`A`) is not read.
    file:
      type: string
      contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      description: |
        `.xlsx` only (content must start with `PK\3\4`), at most 5 MB (5 242 880 bytes). Only
        the active sheet is read; row 1 is the header. The file is not stored.
    overwrite:
      type: boolean
      default: false
      description: |
        Must be `true` to import into a date that already has this dataset; the stored data for
        the date is then replaced as a whole. Without it such a request is answered with 409
        `date_exists`.

YieldCurveImportProblem:
  description: |
    A rejected import. `code` names the reason; `row` and `column` locate a bad cell
    (`invalid_value`, `duplicate_period`), `count` is how many rows the date already has
    (`date_exists`). Nothing is written when an import fails.
  allOf:
    - $ref: ./common.yaml#/ErrorMessage
    - type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [date_required, file_required, not_xlsx, file_too_large, no_rows, too_many_rows,
            invalid_value, duplicate_period, date_exists]
        row:
          type: integer
          format: int32
          description: Spreadsheet row number (1-based).
        column:
          type: string
          description: Spreadsheet column letter (`A`–`D`).
        count:
          type: integer
          format: int32

# --- AZIR import (spec 058) -------------------------------------------------------------------

AzirImportForm:
  type: object
  required: [file]
  properties:
    file:
      type: string
      contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      description: |
        `.xlsx` only (content must start with `PK\3\4`), at most 5 MB (5 242 880 bytes). Only
        the active sheet is read. The file is not stored.
    overwrite:
      type: boolean
      default: false
      description: |
        Must be `true` when the date already has any of the file's tenors; those tenors are then
        replaced. Without it such a request is answered with 409 `date_exists`.

AzirImportResult:
  type: object
  required: [valueDate, values, skipped, volumeConverted]
  properties:
    valueDate:
      $ref: ./common.yaml#/Date
    values:
      type: array
      description: The tenors written, in file order.
      items:
        $ref: '#/AzirImportValue'
    skipped:
      type: array
      description: Recognised rows that were not written, in file order.
      items:
        $ref: '#/AzirImportSkipped'
    volumeConverted:
      type: boolean
      description: The 1D deal volume was given in manat and divided by 1 000 000.

AzirImportFields:
  type: object
  required: [rate, dealVolume, dealCount, minRate, maxRate, isReservePlan]
  properties:
    rate:
      type: number
      description: Percent, 4 decimals.
    dealVolume:
      $ref: '#/AzirDealVolume'
    dealCount:
      $ref: '#/AzirDealCount'
    minRate:
      $ref: '#/AzirMinRate'
    maxRate:
      $ref: '#/AzirMaxRate'
    isReservePlan:
      $ref: '#/AzirIsReservePlan'

AzirImportValue:
  allOf:
    - $ref: '#/AzirImportFields'
    - type: object
      required: [term, previous]
      properties:
        term:
          type: string
          enum: ['1D', '30D', '90D', '180D']
        previous:
          description: The stored value this import replaced, or null when the tenor was new for the date.
          oneOf:
            - type: 'null'
            - $ref: '#/AzirImportFields'

AzirImportSkipped:
  type: object
  required: [row, name, reason]
  properties:
    row:
      type: integer
      format: int32
      description: Spreadsheet row number (1-based).
    name:
      type: string
      description: The name as written in the file, trimmed.
    reason:
      type: string
      enum: [tfai, empty]
      description: '`tfai` — the TFAI index is not stored; `empty` — the tenor has no rate in the file.'

AzirImportProblem:
  description: |
    A rejected import. `code` names the reason; `row` and `column` locate a bad cell; `valueDate`
    is the file's date (`date_in_future`, `date_exists`); `count` and `terms` describe the stored
    tenors (`date_exists`). Nothing is written when an import fails.
  allOf:
    - $ref: ./common.yaml#/ErrorMessage
    - type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [file_required, not_xlsx, file_too_large, date_missing, date_in_future, header_missing,
            unknown_index, duplicate_index, missing_1d, invalid_value, ambiguous_volume, date_exists]
        row:
          type: integer
          format: int32
          description: Spreadsheet row number (1-based).
        column:
          type: string
          description: Spreadsheet column letter (`B`–`E`).
        valueDate:
          $ref: ./common.yaml#/Date
        count:
          type: integer
          format: int32
          description: How many of the file's tenors the date already has.
        terms:
          type: array
          items:
            type: string

YieldCurveDate:
  type: object
  required: [curveDate, pointsCount, updatedAt]
  properties:
    curveDate:
      $ref: ./common.yaml#/Date
    pointsCount:
      type: integer
      format: int32
    updatedAt:
      $ref: ./common.yaml#/DateTime
      description: When the date's points were last imported.

YieldCurveDatePage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/YieldCurveDate'

YieldCurvePoint:
  type: object
  required: [period, yield]
  properties:
    period:
      type: integer
      format: int32
      description: Tenor in days (column `B`).
    yield:
      type: number
      description: Yield, % (column `C`); `numeric(8,4)`.

YieldCurvePoints:
  type: object
  required: [curveDate, points]
  properties:
    curveDate:
      $ref: ./common.yaml#/Date
    points:
      type: array
      description: Ordered by `period`.
      items:
        $ref: '#/YieldCurvePoint'

YieldCurveImportResult:
  type: object
  required: [curveDate, imported]
  properties:
    curveDate:
      $ref: ./common.yaml#/Date
    imported:
      type: integer
      format: int32
      description: Number of points written.

YieldCurveParameters:
  description: Nelson–Siegel parameters for one date; each `numeric(12,6)`.
  type: object
  required: [curveDate, beta0, beta1, beta2, lambda, updatedAt]
  properties:
    curveDate:
      $ref: ./common.yaml#/Date
    beta0:
      type: number
    beta1:
      type: number
    beta2:
      type: number
    lambda:
      type: number
    updatedAt:
      $ref: ./common.yaml#/DateTime

YieldCurveParametersPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/YieldCurveParameters'

YieldCurvePeriods:
  description: Yields (%) at the seven standard tenors for one date; each `numeric(8,4)`.
  type: object
  required: [curveDate, threeMonth, sixMonth, nineMonth, oneYear, twoYear, threeYear, fourYear,
    updatedAt]
  properties:
    curveDate:
      $ref: ./common.yaml#/Date
    threeMonth:
      type: number
      description: Cell `C2`.
    sixMonth:
      type: number
      description: Cell `C3`.
    nineMonth:
      type: number
      description: Cell `C4`.
    oneYear:
      type: number
      description: Cell `C5`.
    twoYear:
      type: number
      description: Cell `C6`.
    threeYear:
      type: number
      description: Cell `C7`.
    fourYear:
      type: number
      description: Cell `C8`.
    updatedAt:
      $ref: ./common.yaml#/DateTime

YieldCurvePeriodsPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/YieldCurvePeriods'
