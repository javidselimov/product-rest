MeasDocumentListItem:
  type: object
  required: [id, emitentId, emitentName, infoTypeId, infoTypeName, regDate, dqn, mediaId, status, updatedAt]
  properties:
    id:
      type: integer
      format: int64
    emitentId:
      type: integer
      format: int32
    emitentName:
      type: [string, 'null']
      description: The emitent's az name, else any locale's; null only if it has no translations.
    infoTypeId:
      type: integer
      format: int32
    infoTypeName:
      type: [string, 'null']
      description: The info type's az name, else any locale's; null only if it has no translations.
    regDate:
      $ref: ./common.yaml#/Date
    dqn:
      type: [string, 'null']
      description: State registration number.
    mediaId:
      type: [integer, 'null']
      format: int64
    status:
      $ref: ./common.yaml#/ContentStatus
    updatedAt:
      $ref: ./common.yaml#/DateTime

MeasDocumentPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/MeasDocumentListItem'

MeasDocumentMedia:
  description: The attached file's metadata.
  type: object
  required: [id, originalName, mimeType, sizeBytes]
  properties:
    id:
      type: integer
      format: int64
    originalName:
      type: string
    mimeType:
      type: string
    sizeBytes:
      type: integer
      format: int64

MeasDocumentDetail:
  type: object
  required: [id, emitentId, infoTypeId, regDate, dqn, mediaId, status, updatedAt, media]
  properties:
    id:
      type: integer
      format: int64
    emitentId:
      type: integer
      format: int32
    infoTypeId:
      type: integer
      format: int32
    regDate:
      $ref: ./common.yaml#/Date
    dqn:
      type: [string, 'null']
      description: State registration number.
    mediaId:
      type: [integer, 'null']
      format: int64
    status:
      $ref: ./common.yaml#/ContentStatus
    updatedAt:
      $ref: ./common.yaml#/DateTime
    media:
      description: |
        Null when `mediaId` is null, when the media asset is soft-deleted, and always in
        create/update responses (not loaded there) — re-fetch the item to see it.
      oneOf:
        - $ref: '#/MeasDocumentMedia'
        - type: 'null'

MeasDocumentUpsert:
  type: object
  required: [emitentId, infoTypeId, regDate, status]
  properties:
    emitentId:
      type: integer
      format: int32
      description: Id of an existing emitent (active or not).
    infoTypeId:
      type: integer
      format: int32
      description: Id of an existing information type (active or not).
    regDate:
      $ref: ./common.yaml#/Date
    dqn:
      type: [string, 'null']
      description: State registration number.
    mediaId:
      type: [integer, 'null']
      format: int64
      description: Id of an existing media asset; null or omitted clears it.
    status:
      $ref: ./common.yaml#/ContentStatus

MeasLookupTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string

MeasLookup:
  description: An emitent or an information type (same shape).
  type: object
  required: [id, isActive, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    isActive:
      type: boolean
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MeasLookupTranslation'

MeasLookupUpsert:
  type: object
  required: [isActive, translations]
  properties:
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MeasLookupTranslation'
