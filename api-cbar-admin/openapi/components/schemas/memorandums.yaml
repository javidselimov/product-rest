MemorandumListItem:
  type: object
  required: [id, status, sortOrder, showAz, showEn, organization, country, signedYear]
  properties:
    id:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    sortOrder:
      type: integer
      format: int32
    showAz:
      type: boolean
    showEn:
      type: boolean
    organization:
      type: [string, 'null']
      description: The az organization name, else any locale's.
    country:
      type: [string, 'null']
      description: The country in the same locale as `organization`.
    signedYear:
      type: integer
      format: int16

MemorandumPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/MemorandumListItem'

MemorandumTranslation:
  type: object
  required: [organization, country]
  properties:
    organization:
      type: string
      minLength: 1
      maxLength: 500
      description: The counterparty — a central bank, a ministry or a supervisor.
    country:
      type: string
      minLength: 1
      maxLength: 100
      description: Free text, shown as typed.

MemorandumUpsert:
  type: object
  required: [signedYear, status, translations]
  properties:
    signedYear:
      type: integer
      format: int16
      minimum: 1991
      description: The year of signing; at most next year.
    sortOrder:
      type: integer
      format: int32
      default: 0
      description: Order among the memorandums of one year.
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused: memorandums have no planned publication."
    showAz:
      type: boolean
      default: true
    showEn:
      type: boolean
      default: true
    translations:
      type: object
      minProperties: 1
      description: At least one locale; a locale left out does not show on the site.
      additionalProperties:
        $ref: '#/MemorandumTranslation'

MemorandumDetail:
  type: object
  required: [id, signedYear, sortOrder, status, showAz, showEn, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    signedYear:
      type: integer
      format: int16
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    showAz:
      type: boolean
    showEn:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    translations:
      type: object
      additionalProperties:
        $ref: '#/MemorandumTranslation'
