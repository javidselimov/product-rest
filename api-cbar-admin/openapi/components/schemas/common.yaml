# Cross-cutting schemas. Referenced as <relative>/components/schemas/common.yaml#/<Name>.

ProblemDetails:
  description: |
    RFC 9457 problem details (`application/problem+json`) — the body of every 4xx/5xx this
    API returns, whether a controller, the framework (binding, authentication, routing) or the
    global exception handler produced it. Internal details (SQL, constraint or table names,
    stack traces) never appear; quote `traceId` to find the request in the server log.
  type: object
  required: [type, status, traceId]
  properties:
    type:
      type: string
      description: |
        The framework's default (an RFC 9110 section link) for ordinary failures. A write
        rejected by the database carries a stable URN instead:
        `urn:cbar:problem:unique-violation` (409), `urn:cbar:problem:reference-in-use` (409,
        delete of still-referenced data), `urn:cbar:problem:reference-missing` (400),
        `urn:cbar:problem:value-too-long`, `urn:cbar:problem:value-out-of-range`,
        `urn:cbar:problem:value-required`, `urn:cbar:problem:value-rejected` (all 400).
    title:
      type: string
      description: |
        Short name of the status. Omitted on 401, 403 and 5xx that carry no `message`, so a
        client that shows `title` falls back to its own (localised) text, as it did when those
        responses had no body.
    status:
      type: integer
      format: int32
    detail:
      type: string
      description: Human-readable explanation; the same text as `message` when both are present.
    instance:
      type: string
    traceId:
      type: string
    message:
      type: string
      description: |
        Transitional: the text the earlier `{ message }` bodies carried, unchanged, for clients
        that read it. Present on every business-rule failure and on database rejections.
    code:
      type: string
      description: Machine-readable reason, only on the auth endpoints, where the panel branches on it.
      enum: [refresh_missing, refresh_stale, refresh_invalid, refresh_reused, refresh_expired, origin_forbidden]
    field:
      type: string
      description: The field whose value collided (`slug`) on a `unique-violation`.
    locale:
      type: string
      description: The locale of the collision, when it can be determined unambiguously.

ValidationProblemDetails:
  allOf:
    - $ref: '#/ProblemDetails'
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          description: |
            Field name → error messages. Body fields use the DTO's PascalCase name
            (`Username`), or a JSON path (`$.translations`) when the body could not be parsed.
          additionalProperties:
            type: array
            items:
              type: string

ErrorMessage:
  description: A problem details body that names the failure in `message` (business rules, database rejections).
  allOf:
    - $ref: '#/ProblemDetails'
    - type: object
      required: [message, detail]

PageMeta:
  description: |
    Paging envelope fields; `page` and `pageSize` are the values actually applied after
    clamping (see the `page` and `pageSize` parameters), not necessarily the ones sent.
  type: object
  required: [total, page, pageSize]
  properties:
    total:
      type: integer
      format: int32
      minimum: 0
    page:
      type: integer
      format: int32
    pageSize:
      type: integer
      format: int32

ContentStatus:
  description: |
    Editorial status. Sent and returned as a lowercase string. Only `published` items
    (and, for dated content, `publishedAt` in the past) reach the public site.
  type: string
  enum: [draft, scheduled, published, archived]

Locale:
  type: string
  enum: [az, en]

AssetRef:
  description: |
    A media asset attached to a content item, in attachment order. The media fields are
    null only if the asset row vanished underneath the attachment.
  type: object
  required: [mediaId, originalName, mimeType, sizeBytes]
  properties:
    mediaId:
      type: integer
      format: int64
    originalName:
      type: [string, 'null']
    mimeType:
      type: [string, 'null']
    sizeBytes:
      type: [integer, 'null']
      format: int64

AttachAsset:
  type: object
  required: [mediaId]
  properties:
    mediaId:
      type: integer
      format: int64
      description: Id of an existing `media_assets` row (`POST /api/v1/media` first).

Date:
  type: string
  format: date
  description: Calendar date, `yyyy-MM-dd`.

DateTime:
  type: string
  format: date-time

NullableDate:
  type: [string, 'null']
  format: date

NullableDateTime:
  type: [string, 'null']
  format: date-time

NullableString:
  type: [string, 'null']
