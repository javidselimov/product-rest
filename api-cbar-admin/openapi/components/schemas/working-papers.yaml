WorkingPaperLanguage:
  type: string
  enum: [az, en, other]
  description: The language the paper is written in (not the site locale).

WorkingPaperListItem:
  type: object
  required: [id, number, year, code, title, status, locales, updatedAt]
  properties:
    id:
      type: integer
      format: int32
    number:
      type: integer
      format: int16
    year:
      type: integer
      format: int16
    code:
      type: string
      description: '`NN/YYYY`, the number padded to two digits.'
      examples: ['02/2025']
    title:
      type: [string, 'null']
      description: The az title, else the en one.
    status:
      $ref: ./common.yaml#/ContentStatus
    locales:
      type: array
      description: Locales with a title, so the paper shows on that locale's site once published.
      items:
        $ref: ./common.yaml#/Locale
    updatedAt:
      type: string
      format: date-time

WorkingPaperPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/WorkingPaperListItem'

WorkingPaperTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
      maxLength: 500
      description: Blank counts as no translation in that locale.
    authors:
      type: array
      description: In display order; required (at least one) when `title` is filled.
      items:
        type: string
    abstract:
      type: [string, 'null']
      description: Plain text; a line break starts a new paragraph on the site.
    keywords:
      type: array
      items:
        type: string
    mediaId:
      type: [integer, 'null']
      format: int64
      description: |
        The PDF; a media library file that exists, is not deleted and is not an image (400 with
        `errors["translations.<locale>.mediaId"]` otherwise). Checked for every locale, titled or not,
        since an untitled translation keeps its file too.

WorkingPaperUpsert:
  type: object
  required: [number, year, paperLanguage, status, translations]
  properties:
    number:
      type: integer
      format: int16
      minimum: 1
      maximum: 99
      description: Position within the year; unique per year among papers that are not deleted.
    year:
      type: integer
      format: int16
      minimum: 1990
      description: At most next year.
    paperLanguage:
      $ref: '#/WorkingPaperLanguage'
    jelCodes:
      type: array
      description: A letter and one or two digits each (`E58`, `C2`).
      items:
        type: string
        pattern: '^[A-Za-z][0-9]{1,2}$'
    legacyPageId:
      type: [integer, 'null']
      format: int32
      minimum: 1
      description: The legacy site's page id (`page-<id>/…`), set by the migration seed; unique. Omitted or null on update keeps the stored value.
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused: a paper has no planned publication."
    translations:
      type: object
      minProperties: 1
      description: Locale → translation; at least one locale with a title.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/WorkingPaperTranslationInput'

WorkingPaperMedia:
  type: object
  required: [id, originalName, mimeType, sizeBytes]
  properties:
    id:
      type: integer
      format: int64
    originalName:
      type: string
    mimeType:
      type: string
    sizeBytes:
      type: integer
      format: int64

WorkingPaperTranslation:
  type: object
  required: [title, authors, abstract, keywords, mediaId, media]
  properties:
    title:
      type: string
    authors:
      type: array
      items:
        type: string
    abstract:
      type: [string, 'null']
    keywords:
      type: array
      items:
        type: string
    mediaId:
      type: [integer, 'null']
      format: int64
    media:
      description: The file; null when there is none or it was deleted from the media library.
      oneOf:
        - $ref: '#/WorkingPaperMedia'
        - type: 'null'

WorkingPaperDetail:
  type: object
  required: [id, number, year, code, paperLanguage, jelCodes, legacyPageId, status, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    number:
      type: integer
      format: int16
    year:
      type: integer
      format: int16
    code:
      type: string
      examples: ['02/2025']
    paperLanguage:
      $ref: '#/WorkingPaperLanguage'
    jelCodes:
      type: array
      items:
        type: string
    legacyPageId:
      type: [integer, 'null']
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/WorkingPaperTranslation'
