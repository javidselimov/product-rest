PermissionCode:
  description: '`<module>.<action>`, e.g. `pages.delete_subtree`. The catalog lives in `Authorization/Permissions.cs` and the `permissions` table.'
  type: string
  pattern: ^[a-z_]+\.[a-z_]+$

MePermissions:
  type: object
  required: [role, permissions]
  properties:
    role:
      description: The role code from the access token; empty when the token has none.
      type: string
    permissions:
      type: array
      items:
        $ref: '#/PermissionCode'

RoleWithPermissions:
  type: object
  required: [id, code, name, permissions]
  properties:
    id:
      type: integer
      format: int32
    code:
      type: string
    name:
      type: string
    permissions:
      type: array
      items:
        $ref: '#/PermissionCode'

AuditLogEntry:
  type: object
  required: [id, action, actorId, actorUsername, entityType, entityId, before, after, ip, userAgent, createdAt]
  properties:
    id:
      type: integer
      format: int64
    action:
      type: string
    actorId:
      type: [integer, 'null']
      format: int32
    actorUsername:
      type: [string, 'null']
    entityType:
      type: [string, 'null']
    entityId:
      type: [integer, 'null']
      format: int64
    before:
      description: Any JSON value, as stored (`jsonb`).
    after:
      description: Any JSON value, as stored (`jsonb`). For `authz.denied`, `{ permission, method, path }`.
    ip:
      type: [string, 'null']
    userAgent:
      type: [string, 'null']
    createdAt:
      $ref: ./common.yaml#/DateTime

AuditLogPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/AuditLogEntry'
