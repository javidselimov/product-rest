# Photo galleries, videos and live video streams.
# Source: Controllers/{Galleries,Videos,VideoStreams}Controller.cs, Entities/MediaContent.cs.

# --- Galleries ---------------------------------------------------------------

GalleryListItem:
  type: object
  required: [id, eventDate, sortOrder, isActive, updatedAt, imageCount, title]
  properties:
    id:
      type: integer
      format: int32
    eventDate:
      $ref: ./common.yaml#/NullableDate
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    updatedAt:
      $ref: ./common.yaml#/DateTime
    imageCount:
      type: integer
      format: int32
      minimum: 0
    title:
      type: [string, 'null']
      description: The az title, else any locale's; null only if the gallery has no translations.

GalleryPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/GalleryListItem'

GalleryTranslation:
  type: object
  required: [title]
  properties:
    title:
      type: string

GalleryImage:
  description: One image in a gallery. `id` is the gallery-image id used by the `/images/…` routes, not the media id.
  type: object
  required: [id, mediaId, originalName, sortOrder]
  properties:
    id:
      type: integer
      format: int64
    mediaId:
      type: integer
      format: int64
    originalName:
      type: [string, 'null']
      description: The media asset's original file name.
    sortOrder:
      type: integer
      format: int32

GalleryDetail:
  type: object
  required: [id, eventDate, sortOrder, isActive, updatedAt, translations, images]
  properties:
    id:
      type: integer
      format: int32
    eventDate:
      $ref: ./common.yaml#/NullableDate
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/GalleryTranslation'
    images:
      type: array
      description: Ordered by `sortOrder`.
      items:
        $ref: '#/GalleryImage'

GalleryTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string

GalleryUpsert:
  type: object
  required: [sortOrder, isActive, translations]
  properties:
    eventDate:
      $ref: ./common.yaml#/NullableDate
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      minProperties: 1
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/GalleryTranslationInput'

GalleryImageAttached:
  description: The newly created gallery image.
  type: object
  required: [id, mediaId, sortOrder]
  properties:
    id:
      type: integer
      format: int64
      description: Gallery-image id (for detach and reorder).
    mediaId:
      type: integer
      format: int64
    sortOrder:
      type: integer
      format: int32

GalleryImageOrder:
  type: object
  required: [imageIds]
  properties:
    imageIds:
      type: array
      description: |
        Every gallery-image id (`images[].id`, not media ids) of the gallery, exactly once, in
        the new order. `sortOrder` is rewritten as 1, 2, 3, … in this order.
      uniqueItems: true
      items:
        type: integer
        format: int64

# --- Videos ------------------------------------------------------------------

VideoListItem:
  type: object
  required: [id, youtubeUrl, publishedAt, sortOrder, isActive, updatedAt, title]
  properties:
    id:
      type: integer
      format: int32
    youtubeUrl:
      type: string
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    updatedAt:
      $ref: ./common.yaml#/DateTime
    title:
      type: [string, 'null']
      description: The az title, else any locale's; null only if the video has no translations.

VideoPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/VideoListItem'

VideoTranslation:
  type: object
  required: [title]
  properties:
    title:
      type: string

VideoDetail:
  type: object
  required: [id, youtubeUrl, publishedAt, sortOrder, isActive, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    youtubeUrl:
      type: string
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/VideoTranslation'

VideoTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string

VideoUpsert:
  type: object
  required: [youtubeUrl, sortOrder, isActive, translations]
  properties:
    youtubeUrl:
      type: string
      description: Stored as sent; not validated as a URL or as a YouTube link.
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      minProperties: 1
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/VideoTranslationInput'

# --- Video streams -----------------------------------------------------------

VideoStreamTranslation:
  type: object
  required: [title]
  properties:
    title:
      type: string

VideoStream:
  type: object
  required: [id, streamUrl, isLive, startsAt, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    streamUrl:
      type: string
    isLive:
      type: boolean
    startsAt:
      $ref: ./common.yaml#/NullableDateTime
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/VideoStreamTranslation'

VideoStreamList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/VideoStream'

VideoStreamTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string

VideoStreamUpsert:
  type: object
  required: [streamUrl, isLive, translations]
  properties:
    streamUrl:
      type: string
      description: Stored as sent; not validated as a URL.
    isLive:
      type: boolean
    startsAt:
      $ref: ./common.yaml#/NullableDateTime
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      minProperties: 1
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/VideoStreamTranslationInput'

# --- Image popups ----------------------------------------------------------

ImagePopupTranslation:
  type: object
  required: [mediaId, mediaName, link, altText]
  properties:
    mediaId:
      type: [integer, 'null']
      format: int64
    mediaName:
      type: [string, 'null']
      description: The image's original file name. Null when there is no image or the asset is soft-deleted.
    link:
      type: [string, 'null']
    altText:
      type: [string, 'null']

ImagePopup:
  type: object
  required: [id, title, isActive, activatedAt, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: string
      description: Internal name for the panel; not shown on the public site.
    isActive:
      type: boolean
    activatedAt:
      $ref: ./common.yaml#/NullableDateTime
      description: |
        Last time the popup was created active or switched from inactive to active. The
        public site shows the active popup with the latest value. Null if never activated.
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/ImagePopupTranslation'

ImagePopupList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ImagePopup'

ImagePopupTranslationInput:
  type: object
  description: All fields are optional; a locale without an image is never shown publicly.
  properties:
    mediaId:
      type: [integer, 'null']
      format: int64
      description: Id of an existing, not soft-deleted image (`image/*`) asset.
    link:
      type: [string, 'null']
      maxLength: 1000
      description: |
        Absolute `http://` / `https://` URL or a site-relative path starting with `/`
        (not `//`). Any other scheme is rejected.
    altText:
      type: [string, 'null']
      maxLength: 500

ImagePopupUpsert:
  type: object
  required: [title, isActive, translations]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 500
      description: Trimmed; blank is rejected.
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation. At least one entry must carry a `mediaId`.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/ImagePopupTranslationInput'
