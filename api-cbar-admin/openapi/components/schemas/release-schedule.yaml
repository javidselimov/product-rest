ReleaseTimingMode:
  type: string
  enum: [text, link, decisions]
  description: >-
    What the timing cell does: `text` is plain text, `link` links to `timingUrl`, `decisions`
    opens the monetary policy decisions dialog on the site (dates from events of type 1).

ReleaseScheduleItemListItem:
  type: object
  required: [id, title, group, periodicity, timingMode, sortOrder, status, showAz, showEn]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: [string, 'null']
      description: The az title, else any locale's.
    group:
      type: [string, 'null']
      description: The az group name, else any locale's.
    periodicity:
      type: [string, 'null']
      description: The az periodicity name, else any locale's; null without a periodicity.
    timingMode:
      $ref: '#/ReleaseTimingMode'
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    showAz:
      type: boolean
    showEn:
      type: boolean

ReleaseScheduleItemPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/ReleaseScheduleItemListItem'

ReleaseScheduleItemTranslation:
  type: object
  required: [title]
  properties:
    title:
      type: string
      maxLength: 500
    timing:
      type: [string, 'null']
      maxLength: 500
      description: By when it is published. Blank is stored as null.

ReleaseScheduleItemUpsert:
  type: object
  required: [groupId, timingMode, status, translations]
  properties:
    groupId:
      type: integer
      format: int32
    periodicityId:
      type: [integer, 'null']
      format: int32
    timingMode:
      $ref: '#/ReleaseTimingMode'
    timingUrl:
      type: [string, 'null']
      maxLength: 1000
      description: >-
        Required in the `link` mode: `http://`, `https://` or a site path starting with `/` (not `//`).
        Ignored and stored as null in the other modes.
    sortOrder:
      type: integer
      format: int32
      default: 0
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused: schedule items have no planned publication."
    showAz:
      type: boolean
      default: true
    showEn:
      type: boolean
      default: true
    translations:
      type: object
      minProperties: 1
      description: At least one locale; a locale left out does not show on the site.
      additionalProperties:
        $ref: '#/ReleaseScheduleItemTranslation'

ReleaseScheduleItemDetail:
  type: object
  required:
    - id
    - groupId
    - periodicityId
    - timingMode
    - timingUrl
    - sortOrder
    - status
    - showAz
    - showEn
    - createdAt
    - updatedAt
    - translations
  properties:
    id:
      type: integer
      format: int32
    groupId:
      type: integer
      format: int32
    periodicityId:
      type: [integer, 'null']
      format: int32
    timingMode:
      $ref: '#/ReleaseTimingMode'
    timingUrl:
      type: [string, 'null']
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    showAz:
      type: boolean
    showEn:
      type: boolean
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      additionalProperties:
        $ref: '#/ReleaseScheduleItemTranslation'

ReleaseScheduleNameTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string
      maxLength: 300

ReleaseScheduleGroupListItem:
  type: object
  required: [id, sortOrder, isActive, name, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    name:
      type: [string, 'null']
      description: The az name, else any locale's.
    translations:
      type: object
      additionalProperties:
        $ref: '#/ReleaseScheduleNameTranslation'

ReleaseScheduleGroupUpsert:
  type: object
  required: [translations]
  properties:
    sortOrder:
      type: integer
      format: int32
      default: 0
    isActive:
      type: boolean
      default: true
      description: An inactive group and its items do not show on the site.
    translations:
      type: object
      minProperties: 1
      additionalProperties:
        $ref: '#/ReleaseScheduleNameTranslation'

ReleaseScheduleGroupDetail:
  type: object
  required: [id, sortOrder, isActive, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      additionalProperties:
        $ref: '#/ReleaseScheduleNameTranslation'

ReleaseSchedulePeriodicityListItem:
  type: object
  required: [id, sortOrder, name, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    name:
      type: [string, 'null']
      description: The az name, else any locale's.
    translations:
      type: object
      additionalProperties:
        $ref: '#/ReleaseScheduleNameTranslation'

ReleaseSchedulePeriodicityUpsert:
  type: object
  required: [translations]
  properties:
    sortOrder:
      type: integer
      format: int32
      default: 0
    translations:
      type: object
      minProperties: 1
      additionalProperties:
        $ref: '#/ReleaseScheduleNameTranslation'

ReleaseSchedulePeriodicityDetail:
  type: object
  required: [id, sortOrder, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    translations:
      type: object
      additionalProperties:
        $ref: '#/ReleaseScheduleNameTranslation'
