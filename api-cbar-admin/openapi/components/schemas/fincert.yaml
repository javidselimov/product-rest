# FinCERT (spec 053): the settings record, activity directions and international memberships.
# Referenced as ../components/schemas/fincert.yaml#/<Name>.

FincertOrder:
  type: object
  required: [ids]
  properties:
    ids:
      type: array
      description: Every non-deleted item of the list exactly once, in the new order.
      items:
        type: integer
        format: int32

FincertLocales:
  type: array
  description: Locales whose translation is complete.
  items:
    $ref: ./common.yaml#/Locale

FincertFieldProblem:
  description: |
    A field was rejected by the controller. `message` is the first failure; `errors` maps each failing
    field (camelCase body path, e.g. `email`, `translations.az.rfcUrl`) to its messages.
  allOf:
    - $ref: ./common.yaml#/ErrorMessage
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

# Settings (single record)

FincertSettingsTranslation:
  type: object
  required: [mission, portalTitle, portalDescription, rfcMediaId, rfcUrl, rfcFile]
  properties:
    mission:
      type: [string, 'null']
      description: Plain text; line breaks become paragraphs on the site.
    portalTitle:
      type: [string, 'null']
    portalDescription:
      type: [string, 'null']
    rfcMediaId:
      type: [integer, 'null']
      format: int64
    rfcUrl:
      type: [string, 'null']
      description: External link; the site ignores it while `rfcMediaId` names a file.
    rfcFile:
      description: The file `rfcMediaId` names; null when there is none or it is deleted.
      oneOf:
        - $ref: ./common.yaml#/AssetRef
        - type: 'null'

FincertSettings:
  type: object
  required: [email, phone, portalUrl, updatedAt, translations]
  properties:
    email:
      type: [string, 'null']
    phone:
      type: [string, 'null']
      description: Shown as written; the site builds the `tel:` link from its digits and `+`.
    portalUrl:
      type: [string, 'null']
    updatedAt:
      type: [string, 'null']
      format: date-time
      description: Null until the settings are first saved.
    translations:
      type: object
      description: Empty until the settings are first saved.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/FincertSettingsTranslation'

FincertSettingsTranslationUpdate:
  type: object
  properties:
    mission:
      type: [string, 'null']
    portalTitle:
      type: [string, 'null']
      maxLength: 255
    portalDescription:
      type: [string, 'null']
      maxLength: 1000
    rfcMediaId:
      type: [integer, 'null']
      format: int64
      description: An existing, non-deleted document (PDF, DOC(X), XLS(X), ZIP, TXT).
    rfcUrl:
      type: [string, 'null']
      maxLength: 500
      description: An absolute `http://` or `https://` URL.

FincertSettingsUpdate:
  type: object
  properties:
    email:
      type: [string, 'null']
      maxLength: 255
      description: Empty or a valid e-mail address.
    phone:
      type: [string, 'null']
      maxLength: 64
    portalUrl:
      type: [string, 'null']
      maxLength: 500
      description: An absolute `http://` or `https://` URL; required while a locale has a portal title.
    translations:
      type: object
      description: |
        Locales to change. Unlike the other sections, a locale left out is **kept**; within a sent locale a
        missing or null field is cleared.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/FincertSettingsTranslationUpdate'

# Directions

FincertDirectionTranslation:
  type: object
  required: [title, body]
  properties:
    title:
      type: string
      maxLength: 500
    body:
      type: string
      description: HTML from the rich-text editor.

FincertDirectionListItem:
  type: object
  required: [id, number, sortOrder, status, title, locales, incompleteLocales, updatedAt]
  properties:
    id:
      type: integer
      format: int32
    number:
      type: integer
      format: int32
      description: Position among non-deleted directions, from 1.
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    title:
      type: [string, 'null']
      description: The az title, else any locale's.
    locales:
      $ref: '#/FincertLocales'
    incompleteLocales:
      type: array
      description: Locales with a title or a body but not both (normally empty — the API refuses them).
      items:
        $ref: ./common.yaml#/Locale
    updatedAt:
      $ref: ./common.yaml#/DateTime

FincertDirectionPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/FincertDirectionListItem'

FincertDirectionUpsert:
  type: object
  required: [status, translations]
  properties:
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused."
    translations:
      type: object
      minProperties: 1
      description: |
        At least one complete locale. A locale given with only a title or only a body is refused
        (400 with `message`); a locale left out is removed.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/FincertDirectionTranslation'

FincertDirectionDetail:
  type: object
  required: [id, sortOrder, status, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/FincertDirectionTranslation'

# Memberships

FincertMembershipTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string
      maxLength: 255
    description:
      type: [string, 'null']
      maxLength: 1000
    badge:
      type: [string, 'null']
      maxLength: 120
      description: Short label such as "2026-cı ildən tam hüquqlu üzv".

FincertMembershipListItem:
  type: object
  required: [id, sortOrder, status, name, badge, logo, url, locales, updatedAt]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    name:
      type: [string, 'null']
      description: The az name, else any locale's.
    badge:
      type: [string, 'null']
      description: The badge of the same locale as `name`.
    logo:
      description: Null when there is no logo or its file is deleted.
      oneOf:
        - $ref: ./common.yaml#/AssetRef
        - type: 'null'
    url:
      type: [string, 'null']
    locales:
      $ref: '#/FincertLocales'
    updatedAt:
      $ref: ./common.yaml#/DateTime

FincertMembershipPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/FincertMembershipListItem'

FincertMembershipUpsert:
  type: object
  required: [status, translations]
  properties:
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused."
    logoMediaId:
      type: [integer, 'null']
      format: int64
      description: An existing, non-deleted image (`image/*`).
    url:
      type: [string, 'null']
      maxLength: 500
      description: Empty or an absolute `http://` or `https://` URL.
    translations:
      type: object
      minProperties: 1
      description: At least one locale with a name; a locale left out is removed.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/FincertMembershipTranslation'

FincertMembershipDetail:
  type: object
  required: [id, sortOrder, status, logoMediaId, logo, url, createdAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    logoMediaId:
      type: [integer, 'null']
      format: int64
    logo:
      oneOf:
        - $ref: ./common.yaml#/AssetRef
        - type: 'null'
    url:
      type: [string, 'null']
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/FincertMembershipTranslation'
