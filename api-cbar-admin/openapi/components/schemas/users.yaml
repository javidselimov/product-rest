UserListItem:
  type: object
  required: [id, username, email, roleCode, isActive, createdAt]
  properties:
    id:
      type: integer
      format: int32
    username:
      type: string
    email:
      type: string
    roleCode:
      type: string
      description: Role code (seeded roles are `admin`, `moderator`, `meas_manager`).
      examples: [admin]
    isActive:
      type: boolean
    createdAt:
      $ref: ./common.yaml#/DateTime

UserPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/UserListItem'

UserDetail:
  type: object
  required: [id, username, email, roleId, roleCode, isActive, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: int32
    username:
      type: string
    email:
      type: string
    roleId:
      type: integer
      format: int16
    roleCode:
      type: string
      description: Role code (seeded roles are `admin`, `moderator`, `meas_manager`).
      examples: [admin]
    isActive:
      type: boolean
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime

UserPassword:
  type: string
  minLength: 8
  description: |
    At least 8 characters with an uppercase letter, a lowercase letter, a digit and a
    character that is neither a letter nor a digit. Violations return 400 with `message`
    naming the first unmet rule.

UserCreate:
  type: object
  required: [username, email, password, roleId]
  properties:
    username:
      type: string
      description: Non-blank. Unique case-insensitively, including soft-deleted users.
    email:
      type: string
      description: Non-blank (format not checked). Unique case-insensitively, including soft-deleted users.
    password:
      $ref: '#/UserPassword'
    roleId:
      type: integer
      format: int16
      description: Id of an existing role.

UserUpdate:
  type: object
  required: [email, roleId, isActive]
  properties:
    email:
      type: string
      description: Non-blank (format not checked). Unique case-insensitively, including soft-deleted users.
    roleId:
      type: integer
      format: int16
      description: Id of an existing role.
    isActive:
      type: boolean
      description: Setting `false` on an active user revokes all their refresh tokens.

UserPasswordReset:
  type: object
  required: [newPassword]
  properties:
    newPassword:
      $ref: '#/UserPassword'
