PageFlags:
  description: |
    Per-page checkboxes (parity with the legacy admin). `active`, `visible`, `showAz`,
    `showEn` drive public visibility; `showInSideNav` the section's left menu and `showInDropdownNav` the
    dropdown menus.
    `readonly`, `disabled`, `selected`, `collapsed` are admin-tree display hints the API
    stores but does not enforce. `removable`, `removableAll` and `movable*` are enforced by
    delete and move.
  type: object
  required:
    - active
    - visible
    - showAz
    - showEn
    - readonly
    - disabled
    - removable
    - removableAll
    - movableU
    - movableD
    - movableL
    - movableR
    - selected
    - collapsed
    - showInSideNav
    - showInDropdownNav
  properties:
    active:
      type: boolean
      description: Master switch; off hides the page everywhere.
    visible:
      type: boolean
      description: |
        Shown in site navigation: top menu, footer, left menu and breadcrumb. When off, the
        public tree drops the page and lifts its children to the top level.
    showAz:
      type: boolean
    showEn:
      type: boolean
    readonly:
      type: boolean
    disabled:
      type: boolean
    removable:
      type: boolean
      description: The page may be deleted.
    removableAll:
      type: boolean
      description: The page may be deleted together with its descendants.
    movableU:
      type: boolean
      description: May be reordered among its siblings (together with `movableD`).
    movableD:
      type: boolean
      description: May be reordered among its siblings (together with `movableU`).
    movableL:
      type: boolean
      description: May change parent (either `movableL` or `movableR` allows it).
    movableR:
      type: boolean
      description: May change parent (either `movableL` or `movableR` allows it).
    selected:
      type: boolean
    collapsed:
      type: boolean
    showInSideNav:
      type: boolean
      description: |
        Shown in its section's left menu on the public site (spec 041). When off, the page
        stays in the top menu, footer and breadcrumb, and the left menu shows it only while
        the page itself, or a page under it, is open.
    showInDropdownNav:
      type: [boolean, 'null']
      description: |
        Shown in the dropdown menus below its section root (mega menu, mobile drawer; spec 054).
        null = follow `showInSideNav`, which is every page that never set it. `false` + `true`
        is a page only the dropdown menus list ("Ödəniş xidmətləri").

PageFlagsInput:
  description: |
    Same fields as `PageFlags`. Every field is optional; an omitted field takes the default
    shown (not `false`). On update, omitting the whole `flags` object leaves all flags
    unchanged, but sending it resets every omitted field to its default. `showInSideNav` is
    the exception, see the field.
  type: object
  properties:
    active:
      type: boolean
      default: true
    visible:
      type: boolean
      default: true
    showAz:
      type: boolean
      default: true
    showEn:
      type: boolean
      default: true
    readonly:
      type: boolean
      default: false
    disabled:
      type: boolean
      default: false
    removable:
      type: boolean
      default: true
    removableAll:
      type: boolean
      default: false
    movableU:
      type: boolean
      default: true
    movableD:
      type: boolean
      default: true
    movableL:
      type: boolean
      default: false
    movableR:
      type: boolean
      default: false
    selected:
      type: boolean
      default: false
    collapsed:
      type: boolean
      default: false
    showInSideNav:
      type: [boolean, 'null']
      description: |
        Shown in its section's left menu. Unlike the other fields, omitting it (or sending
        null) keeps the stored value on update and means true on create, so a client that
        does not know the field cannot reset it.
    showInDropdownNav:
      type: [boolean, 'null']
      description: |
        Shown in the dropdown menus below its section root (spec 054). Like `showInSideNav`,
        omitting it (or sending null) keeps the stored value on update; on create it means
        "follow `showInSideNav`".

PageTreeNode:
  type: object
  required: [id, parentId, sortOrder, status, title, slug, navUrl, flags, children]
  properties:
    id:
      type: integer
      format: int32
    parentId:
      type: [integer, 'null']
      format: int32
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    title:
      type: [string, 'null']
      description: Title in the requested locale; null if the page has no translation in it.
    slug:
      type: [string, 'null']
      description: Slug in the requested locale; null if the page has no translation in it.
    navUrl:
      type: [string, 'null']
      description: Menu-link override (app route or external URL).
    flags:
      $ref: '#/PageFlags'
    children:
      type: array
      description: Child pages by `sortOrder`; empty for a leaf.
      items:
        $ref: '#/PageTreeNode'

PageTranslation:
  type: object
  required: [title, slug, content, menuGroup]
  properties:
    title:
      type: string
    slug:
      type: string
    content:
      type: [string, 'null']
      description: HTML.
    menuGroup:
      type: [string, 'null']
      description: |
        Menu group label (spec 054): sibling pages with the same label form one group in the
        dropdown menus. Stored only; the public site shows it from spec 055 on.

PageAssetTranslation:
  type: object
  required: [title]
  properties:
    title:
      type: string

PageAsset:
  description: |
    A file attached to a page. `id` is the attachment's own id (used by the `/assets/{assetId}`
    and `/assets/order` routes), not the media id. The media fields are null only if the
    media row vanished underneath the attachment.
  type: object
  required: [id, mediaId, originalName, mimeType, sizeBytes, sortOrder, groupLabel, translations]
  properties:
    id:
      type: integer
      format: int64
    mediaId:
      type: integer
      format: int64
    originalName:
      type: [string, 'null']
    mimeType:
      type: [string, 'null']
    sizeBytes:
      type: [integer, 'null']
      format: int64
    sortOrder:
      type: integer
      format: int32
    groupLabel:
      type: [string, 'null']
      description: Editor-set accordion group on the public page (e.g. a year).
    translations:
      type: object
      description: Locale → display title; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/PageAssetTranslation'

PageDetail:
  type: object
  required: [id, parentId, sortOrder, status, showInFooter, navUrl, flags, translations, assets]
  properties:
    id:
      type: integer
      format: int32
    parentId:
      type: [integer, 'null']
      format: int32
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    showInFooter:
      type: boolean
    navUrl:
      type: [string, 'null']
      description: Menu-link override (app route or external URL).
    flags:
      $ref: '#/PageFlags'
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/PageTranslation'
    assets:
      type: array
      description: Attachments by `sortOrder`.
      items:
        $ref: '#/PageAsset'

PageTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
      maxLength: 500
    content:
      type: [string, 'null']
      description: HTML.
    slug:
      type: [string, 'null']
      description: |
        Optional explicit slug. It is normalised like a generated one (az letters
        transliterated, lowercased, every run of characters outside `a-z0-9` becomes `-`,
        max 200 characters) and suffixed `-2`, `-3` if taken in that locale. Blank or
        omitted: a new translation derives its slug from `title`; an existing one keeps
        its current slug.
    menuGroup:
      type: [string, 'null']
      maxLength: 120
      description: |
        Menu group label (spec 054); trimmed. On update, omitted or null leaves it unchanged —
        send `""` to clear it. Longer than 120 characters after trimming: 400 with
        `errors["translations.<locale>.menuGroup"]`.

PageUpsert:
  type: object
  required: [sortOrder, status, showInFooter, translations]
  properties:
    parentId:
      type: [integer, 'null']
      format: int32
      description: |
        Create: parent page id (null or omitted = root). Update: must be the current parent
        or null/omitted (both ignored); a different id is rejected — use `/move`.
    sortOrder:
      type: integer
      format: int32
      description: Position among siblings (ascending). Stored as sent; siblings are not renumbered.
    status:
      $ref: ./common.yaml#/ContentStatus
    showInFooter:
      type: boolean
    navUrl:
      type: [string, 'null']
      maxLength: 500
      description: |
        Menu-link override; trimmed, blank stored as null. On update, omitted or null leaves
        it unchanged — send `""` to clear it.
    flags:
      oneOf:
        - $ref: '#/PageFlagsInput'
        - type: 'null'
      description: |
        Create: omitted or null = all defaults. Update: omitted or null leaves every flag
        unchanged.
    translations:
      type: object
      description: Locale → translation. Create requires at least one.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/PageTranslationInput'

PageMove:
  type: object
  required: [sortOrder]
  properties:
    newParentId:
      type: [integer, 'null']
      format: int32
      description: New parent page id; null or omitted moves the page to the root.
    sortOrder:
      type: integer
      format: int32
      description: New position among the (new) siblings. Siblings are not renumbered.

PageAssetTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
      maxLength: 500

PageAssetAttach:
  type: object
  required: [mediaId]
  properties:
    mediaId:
      type: integer
      format: int64
      description: Id of an existing media asset (`POST /api/v1/media` first).
    translations:
      type: [object, 'null']
      description: |
        Locale → display title. Null, omitted or empty: both `az` and `en` get the file's
        original name.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/PageAssetTranslationInput'
    groupLabel:
      type: [string, 'null']
      maxLength: 100
      description: Trimmed; blank stored as null.

PageAssetUpdate:
  type: object
  required: [translations]
  properties:
    translations:
      type: object
      description: Locale → display title. At least one; locales absent from the map are deleted.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/PageAssetTranslationInput'
    groupLabel:
      type: [string, 'null']
      maxLength: 100
      description: Trimmed; blank, null or omitted clears it.

PageAssetOrder:
  type: object
  required: [assetIds]
  properties:
    assetIds:
      type: array
      description: |
        Every attachment id of the page (`PageAsset.id`, not media ids), each exactly once,
        in the new order.
      items:
        type: integer
        format: int64
