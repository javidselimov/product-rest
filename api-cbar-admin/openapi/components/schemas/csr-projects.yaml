CsrProjectListItem:
  type: object
  required: [id, status, sortOrder, showAz, showEn, title, categoryName, imageCount]
  properties:
    id:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    sortOrder:
      type: integer
      format: int32
    showAz:
      type: boolean
    showEn:
      type: boolean
    title:
      type: [string, 'null']
      description: The az card title, else any locale's.
    categoryName:
      type: [string, 'null']
      description: The az name, else any locale's.
    imageCount:
      type: integer
      format: int32

CsrProjectPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/CsrProjectListItem'

CsrProjectTranslation:
  type: object
  required: [cardTitle, summary, title]
  properties:
    cardTitle:
      type: string
      maxLength: 255
    summary:
      type: string
      maxLength: 500
    title:
      type: string
      maxLength: 500
      description: The dialog heading.
    content:
      type: [string, 'null']
      description: HTML.

CsrProjectUpsert:
  type: object
  required: [categoryId, status, translations]
  properties:
    categoryId:
      type: integer
      format: int32
    coverMediaId:
      type: [integer, 'null']
      format: int64
      description: Must be an image. Null leaves the first photo as the card image on the site.
    sortOrder:
      type: integer
      format: int32
      default: 0
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused: projects have no planned publication."
    showAz:
      type: boolean
      default: true
    showEn:
      type: boolean
      default: true
    translations:
      type: object
      minProperties: 1
      description: At least one locale; a locale left out does not show on the site.
      additionalProperties:
        $ref: '#/CsrProjectTranslation'

CsrProjectDetail:
  type: object
  required:
    - id
    - categoryId
    - coverMediaId
    - cover
    - sortOrder
    - status
    - showAz
    - showEn
    - createdAt
    - updatedAt
    - translations
    - assets
  properties:
    id:
      type: integer
      format: int32
    categoryId:
      type: integer
      format: int32
    coverMediaId:
      type: [integer, 'null']
      format: int64
    cover:
      description: Display data of the cover for the media field; null without a cover.
      oneOf:
        - $ref: ./common.yaml#/AssetRef
        - type: 'null'
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    showAz:
      type: boolean
    showEn:
      type: boolean
    createdAt:
      $ref: ./common.yaml#/DateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      additionalProperties:
        $ref: '#/CsrProjectTranslation'
    assets:
      type: array
      description: The photos, in display order.
      items:
        $ref: ./common.yaml#/AssetRef

CsrProjectAssetOrder:
  type: object
  required: [mediaIds]
  properties:
    mediaIds:
      type: array
      description: Every photo of the project (`assets[].mediaId`), exactly once, in the new order.
      items:
        type: integer
        format: int64

CsrCategoryListItem:
  type: object
  required: [id, sortOrder, isActive, name, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    name:
      type: [string, 'null']
      description: The az name, else any locale's.
    translations:
      type: object
      additionalProperties:
        $ref: '#/CsrCategoryTranslation'

CsrCategoryTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string
      maxLength: 200

CsrCategoryUpsert:
  type: object
  required: [translations]
  properties:
    sortOrder:
      type: integer
      format: int32
      default: 0
    isActive:
      type: boolean
      default: true
    translations:
      type: object
      minProperties: 1
      additionalProperties:
        $ref: '#/CsrCategoryTranslation'

CsrCategoryDetail:
  type: object
  required: [id, sortOrder, isActive, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      additionalProperties:
        $ref: '#/CsrCategoryTranslation'
