LawListItem:
  type: object
  required: [id, categoryId, type, status, publishedAt, updatedAt, title]
  properties:
    id:
      type: integer
      format: int32
    categoryId:
      type: integer
      format: int32
    type:
      type: integer
      format: int16
      description: Act type code (`1` = law, `2` = regulation by convention; not validated).
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    title:
      type: [string, 'null']
      description: The az title, else any locale's; null only if the item has no translations.

LawPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/LawListItem'

LawTranslation:
  type: object
  required: [title, slug, description]
  properties:
    title:
      type: string
    slug:
      type: string
    description:
      type: [string, 'null']

LawDetail:
  type: object
  required: [id, categoryId, type, status, publishedAt, updatedAt, translations, assets]
  properties:
    id:
      type: integer
      format: int32
    categoryId:
      type: integer
      format: int32
    type:
      type: integer
      format: int16
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/LawTranslation'
    assets:
      type: array
      items:
        $ref: ./common.yaml#/AssetRef

LawTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
    description:
      type: [string, 'null']

LawUpsert:
  type: object
  required: [categoryId, type, status, translations]
  properties:
    categoryId:
      type: integer
      format: int32
      description: Id of an existing law category (active or not).
    type:
      type: integer
      format: int16
      description: Act type code (`1` = law, `2` = regulation by convention; not validated).
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/LawTranslationInput'

LawCategoryTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string

LawCategory:
  type: object
  required: [id, sortOrder, isActive, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/LawCategoryTranslation'

LawCategoryUpsert:
  type: object
  required: [sortOrder, isActive, translations]
  properties:
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/LawCategoryTranslation'
