EventType:
  type: integer
  format: int16
  enum: [1, 2, 3, 4]
  description: "`1` decision, `2` press conference, `3` conference, `4` seminar."

EventListItem:
  type: object
  required: [id, type, status, startsOn, endsOn, title, categoryName]
  properties:
    id:
      type: integer
      format: int32
    type:
      oneOf:
        - $ref: '#/EventType'
        - type: 'null'
    status:
      $ref: ./common.yaml#/ContentStatus
    startsOn:
      type: string
      format: date
    endsOn:
      type: [string, 'null']
      format: date
    title:
      type: [string, 'null']
      description: The az title, else any locale's.
    categoryName:
      type: [string, 'null']
      description: The az name, else any locale's.

EventPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/EventListItem'

EventTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
      maxLength: 500
    location:
      type: [string, 'null']
      maxLength: 255
    content:
      type: [string, 'null']
      description: HTML.

EventTranslation:
  allOf:
    - $ref: '#/EventTranslationInput'
    - type: object
      required: [slug]
      properties:
        slug:
          type: string

EventUpsert:
  type: object
  required: [status, startsOn, translations]
  properties:
    type:
      oneOf:
        - $ref: '#/EventType'
        - type: 'null'
    categoryId:
      type: [integer, 'null']
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
      description: "`scheduled` is refused: events have no planned publication."
    startsOn:
      type: string
      format: date
    endsOn:
      type: [string, 'null']
      format: date
      description: Not before `startsOn`.
    startTime:
      type: [string, 'null']
      description: "`HH:mm`, Asia/Baku time."
    galleryId:
      type: [integer, 'null']
      format: int32
    pressReleaseId:
      type: [integer, 'null']
      format: int32
    pageId:
      type: [integer, 'null']
      format: int32
    translations:
      type: object
      minProperties: 1
      additionalProperties:
        $ref: '#/EventTranslationInput'

EventLink:
  type: object
  required: [id, title]
  properties:
    id:
      type: integer
      format: int32
    title:
      type: [string, 'null']

EventDetail:
  type: object
  required:
    - id
    - type
    - categoryId
    - status
    - startsOn
    - endsOn
    - startTime
    - galleryId
    - pressReleaseId
    - pageId
    - category
    - gallery
    - pressRelease
    - page
    - translations
  properties:
    id:
      type: integer
      format: int32
    type:
      oneOf:
        - $ref: '#/EventType'
        - type: 'null'
    categoryId:
      type: [integer, 'null']
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    startsOn:
      type: string
      format: date
    endsOn:
      type: [string, 'null']
      format: date
    startTime:
      type: [string, 'null']
      description: "`HH:mm`."
    galleryId:
      type: [integer, 'null']
      format: int32
    pressReleaseId:
      type: [integer, 'null']
      format: int32
    pageId:
      type: [integer, 'null']
      format: int32
    category:
      oneOf:
        - $ref: '#/EventLink'
        - type: 'null'
    gallery:
      oneOf:
        - $ref: '#/EventLink'
        - type: 'null'
    pressRelease:
      oneOf:
        - $ref: '#/EventLink'
        - type: 'null'
    page:
      oneOf:
        - $ref: '#/EventLink'
        - type: 'null'
    translations:
      type: object
      additionalProperties:
        $ref: '#/EventTranslation'

EventCategoryListItem:
  type: object
  required: [id, sortOrder, isActive, name, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    name:
      type: [string, 'null']
      description: The az name, else any locale's.
    translations:
      type: object
      additionalProperties:
        $ref: '#/EventCategoryTranslation'

EventCategoryTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string
      maxLength: 200

EventCategoryUpsert:
  type: object
  required: [translations]
  properties:
    sortOrder:
      type: integer
      format: int32
      default: 0
    isActive:
      type: boolean
      default: true
    translations:
      type: object
      minProperties: 1
      additionalProperties:
        $ref: '#/EventCategoryTranslation'

EventCategoryDetail:
  type: object
  required: [id, sortOrder, isActive, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      additionalProperties:
        $ref: '#/EventCategoryTranslation'
