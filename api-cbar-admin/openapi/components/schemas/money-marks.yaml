MoneyMarkCategoryTranslation:
  type: object
  required: [name]
  properties:
    name:
      type: string

MoneyMarkCategory:
  type: object
  required: [id, sortOrder, isActive, translations]
  properties:
    id:
      type: integer
      format: int32
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MoneyMarkCategoryTranslation'

MoneyMarkCategoryUpsert:
  type: object
  required: [sortOrder, isActive, translations]
  properties:
    sortOrder:
      type: integer
      format: int32
    isActive:
      type: boolean
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MoneyMarkCategoryTranslation'

MoneyMarkListItem:
  type: object
  required: [id, categoryId, type, sortOrder, status, updatedAt, title]
  properties:
    id:
      type: integer
      format: int32
    categoryId:
      type: integer
      format: int32
    type:
      type: integer
      format: int16
      description: '`1` = banknote, `2` = coin by convention; not validated.'
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    updatedAt:
      $ref: ./common.yaml#/DateTime
    title:
      type: [string, 'null']
      description: The az title, else any locale's; null only if the item has no translations.

MoneyMarkPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/MoneyMarkListItem'

MoneyMarkTranslation:
  type: object
  required: [title, slug, description, securityFeatures]
  properties:
    title:
      type: string
    slug:
      type: string
    description:
      type: [string, 'null']
    securityFeatures:
      type: [string, 'null']

MoneyMarkDetail:
  type: object
  required: [id, categoryId, type, frontMediaId, rearMediaId, sortOrder, status, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    categoryId:
      type: integer
      format: int32
    type:
      type: integer
      format: int16
    frontMediaId:
      type: [integer, 'null']
      format: int64
      description: Media asset id of the obverse image. Only the id is returned, no file metadata.
    rearMediaId:
      type: [integer, 'null']
      format: int64
      description: Media asset id of the reverse image.
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MoneyMarkTranslation'

MoneyMarkTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
    description:
      type: [string, 'null']
    securityFeatures:
      type: [string, 'null']

MoneyMarkUpsert:
  type: object
  required: [categoryId, type, sortOrder, status, translations]
  properties:
    categoryId:
      type: integer
      format: int32
      description: Id of an existing money-mark category (active or not).
    type:
      type: integer
      format: int16
      description: '`1` = banknote, `2` = coin by convention; not validated.'
    frontMediaId:
      type: [integer, 'null']
      format: int64
      description: Id of an existing media asset; null or omitted clears it.
    rearMediaId:
      type: [integer, 'null']
      format: int64
      description: Id of an existing media asset; null or omitted clears it.
    sortOrder:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MoneyMarkTranslationInput'

MoneyMarkNewsListItem:
  type: object
  required: [id, status, publishedAt, updatedAt, title]
  properties:
    id:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    title:
      type: [string, 'null']
      description: The az title, else any locale's; null only if the item has no translations.

MoneyMarkNewsPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/MoneyMarkNewsListItem'

MoneyMarkNewsTranslation:
  type: object
  required: [title, slug, content]
  properties:
    title:
      type: string
    slug:
      type: string
    content:
      type: [string, 'null']
      description: HTML.

MoneyMarkNewsDetail:
  type: object
  required: [id, status, publishedAt, updatedAt, translations]
  properties:
    id:
      type: integer
      format: int32
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    updatedAt:
      $ref: ./common.yaml#/DateTime
    translations:
      type: object
      description: Locale → translation; only locales that exist.
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MoneyMarkNewsTranslation'

MoneyMarkNewsTranslationInput:
  type: object
  required: [title]
  properties:
    title:
      type: string
    content:
      type: [string, 'null']
      description: HTML.

MoneyMarkNewsUpsert:
  type: object
  required: [status, translations]
  properties:
    status:
      $ref: ./common.yaml#/ContentStatus
    publishedAt:
      $ref: ./common.yaml#/NullableDateTime
    translations:
      type: object
      description: Locale → translation. At least one is required (create and update).
      propertyNames:
        $ref: ./common.yaml#/Locale
      additionalProperties:
        $ref: '#/MoneyMarkNewsTranslationInput'
