MediaItem:
  type: object
  required: [id, originalName, mimeType, sizeBytes, width, height, createdAt]
  properties:
    id:
      type: integer
      format: int64
    originalName:
      type: string
      description: File name as uploaded.
    mimeType:
      type: string
      description: Derived from the file extension at upload, not from the client's `Content-Type`.
    sizeBytes:
      type: integer
      format: int64
    width:
      type: [integer, 'null']
      format: int32
      description: Pixel width. Never filled in by this API's upload, so null for files uploaded here.
    height:
      type: [integer, 'null']
      format: int32
      description: Pixel height. Never filled in by this API's upload, so null for files uploaded here.
    createdAt:
      $ref: ./common.yaml#/DateTime

MediaPage:
  allOf:
    - $ref: ./common.yaml#/PageMeta
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/MediaItem'

MediaUploadResult:
  description: The stored asset. Unlike `MediaItem`, no `width`/`height`.
  type: object
  required: [id, originalName, mimeType, sizeBytes, createdAt]
  properties:
    id:
      type: integer
      format: int64
    originalName:
      type: string
      description: |
        Sanitised (directory parts and control characters removed), at most 255 characters.
        For a deduplicated upload, the name the file was first uploaded under.
    mimeType:
      type: string
    sizeBytes:
      type: integer
      format: int64
    createdAt:
      $ref: ./common.yaml#/DateTime

MediaUpload:
  type: object
  required: [file]
  properties:
    file:
      type: string
      contentMediaType: application/octet-stream
      description: |
        The file, non-empty, at most 250 MB (250 000 000 bytes). Allowed extensions
        (case-insensitive): `.jpg .jpeg .png .gif .webp .svg .pdf .xlsx .xls .docx .doc
        .zip .rar .xml`; the stored MIME type follows the extension.

MediaPreviewUnsupported:
  allOf:
    - $ref: ./common.yaml#/ErrorMessage
    - type: object
      required: [mimeType]
      properties:
        mimeType:
          type: string
          description: The asset's stored MIME type.
