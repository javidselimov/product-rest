# --- Image popups ----------------------------------------------------------

imagePopups:
  get:
    tags: [MediaContent]
    operationId: listImagePopups
    x-permission: image_popups.read
    summary: All image popups, newest first
    description: Every popup, active or not, ordered by id descending (not paged).
    responses:
      '200':
        description: All image popups.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/ImagePopupList
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [MediaContent]
    operationId: createImagePopup
    x-permission: image_popups.create
    summary: Create an image popup
    description: |
      At least one locale must have an image; every `mediaId` must be an existing image
      (`image/*`) asset. Title and link/alt text are trimmed, blank link/alt text becomes
      null. An unknown locale key is rejected with 400. An active popup gets
      `activatedAt = now`, which puts it in front on the public site.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/media-content.yaml#/ImagePopupUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/ImagePopup
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

imagePopup:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [MediaContent]
    operationId: getImagePopup
    x-permission: image_popups.read
    summary: Image popup by id
    responses:
      '200':
        description: The popup with all its translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/ImagePopup
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [MediaContent]
    operationId: updateImagePopup
    x-permission: image_popups.update
    summary: Replace an image popup
    description: |
      Same validation as create. Locales absent from `translations` are deleted. Only an
      inactive → active switch refreshes `activatedAt`; editing an active popup keeps its
      place. The body is validated before the id is looked up, so an invalid body on an
      unknown id is 400, not 404.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/media-content.yaml#/ImagePopupUpsert
    responses:
      '200':
        description: The updated popup.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/ImagePopup
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [MediaContent]
    operationId: deleteImagePopup
    x-permission: image_popups.delete
    summary: Delete an image popup
    description: Hard delete, together with its translations. The images stay in the media library.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
