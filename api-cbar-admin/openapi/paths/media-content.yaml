galleries:
  get:
    tags: [MediaContent]
    operationId: listGalleries
    x-permission: galleries.read
    summary: Photo galleries, newest event first
    description: |
      Ordered by `eventDate` descending, then id descending. Galleries without an
      `eventDate` sort **first** (PostgreSQL puts NULLs first in a descending order).
      `sortOrder` and `isActive` do not affect the list. Soft-deleted galleries are excluded.
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
    responses:
      '200':
        description: One page of galleries.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/GalleryPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [MediaContent]
    operationId: createGallery
    x-permission: galleries.create
    summary: Create a photo gallery
    description: Images are added afterwards (`POST /api/v1/galleries/{id}/images`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/media-content.yaml#/GalleryUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item. `images` is always empty.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/GalleryDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

gallery:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [MediaContent]
    operationId: getGallery
    x-permission: galleries.read
    summary: Photo gallery by id
    responses:
      '200':
        description: The gallery with all translations and its images in order.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/GalleryDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [MediaContent]
    operationId: updateGallery
    x-permission: galleries.update
    summary: Replace a photo gallery
    description: |
      Locales absent from `translations` are deleted. An empty `translations` map is rejected
      (400) before the id is looked up. Images are managed separately (`/images`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/media-content.yaml#/GalleryUpsert
    responses:
      '200':
        description: The updated gallery, images included.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/GalleryDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [MediaContent]
    operationId: deleteGallery
    x-permission: galleries.delete
    summary: Soft-delete a photo gallery
    description: The gallery's images and translations are kept in the database.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

galleryImages:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  post:
    tags: [MediaContent]
    operationId: attachGalleryImage
    x-permission: galleries.update
    summary: Add an uploaded image to a gallery
    description: |
      Appended after the existing images. The same media asset cannot be in one gallery
      twice (409). The media type is not checked — any uploaded file is accepted.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/common.yaml#/AttachAsset
    responses:
      '200':
        description: The new gallery image.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/media-content.yaml#/GalleryImageAttached
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict

galleryImagesOrder:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  put:
    tags: [MediaContent]
    operationId: reorderGalleryImages
    x-permission: galleries.update
    summary: Reorder a gallery's images
    description: '`imageIds` must be exactly the set of the gallery''s image ids, otherwise 400.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/media-content.yaml#/GalleryImageOrder
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

galleryImage:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
    - name: imageId
      in: path
      required: true
      description: Route constraint `{imageId:long}`. The gallery-image id (`images[].id`), not the media id.
      schema:
        type: integer
        format: int64
  delete:
    tags: [MediaContent]
    operationId: detachGalleryImage
    x-permission: galleries.update
    summary: Remove an image from a gallery
    description: |
      Removes the gallery image only; the media asset itself stays. The remaining images keep
      their `sortOrder` (a gap is left). Works on soft-deleted galleries too.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: No image with this id in this gallery.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/ProblemDetails

