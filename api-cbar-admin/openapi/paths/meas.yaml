documents:
  get:
    tags: [Meas]
    operationId: listMeasDocuments
    x-permission: meas.read
    summary: MEAS documents, newest registration first
    description: Ordered by `regDate` descending, then id descending. Soft-deleted items are excluded.
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
      - name: search
        in: query
        description: |
          Case-insensitive substring match (`ILIKE '%…%'`) on `dqn` only — not on emitent or
          info-type names. Documents without a `dqn` never match. Blank is ignored.
        schema:
          type: string
      - name: emitentId
        in: query
        description: Only documents of this emitent.
        schema:
          type: integer
          format: int32
      - name: infoTypeId
        in: query
        description: Only documents of this information type.
        schema:
          type: integer
          format: int32
      - $ref: ../components/parameters.yaml#/Status
    responses:
      '200':
        description: One page of documents.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/meas.yaml#/MeasDocumentPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Meas]
    operationId: createMeasDocument
    x-permission: meas.create
    summary: Create a MEAS document
    description: Rejected with 400 when `emitentId`, `infoTypeId` or `mediaId` does not exist.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/meas.yaml#/MeasDocumentUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item. `media` is always null here.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/meas.yaml#/MeasDocumentDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

document:
  parameters:
    - name: id
      in: path
      required: true
      description: Route constraint `{id:long}` — a non-integer segment does not match the route (404, problem details without `message`).
      schema:
        type: integer
        format: int64
  get:
    tags: [Meas]
    operationId: getMeasDocument
    x-permission: meas.read
    summary: MEAS document by id
    responses:
      '200':
        description: The document with its file metadata.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/meas.yaml#/MeasDocumentDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Meas]
    operationId: updateMeasDocument
    x-permission: meas.update
    summary: Replace a MEAS document
    description: Same reference checks as create. Omitting `dqn` or `mediaId` clears it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/meas.yaml#/MeasDocumentUpsert
    responses:
      '200':
        description: The updated document. `media` is always null here; re-fetch the item to see it.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/meas.yaml#/MeasDocumentDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [Meas]
    operationId: deleteMeasDocument
    x-permission: meas.delete
    summary: Soft-delete a MEAS document
    description: The document keeps blocking deletion of its emitent and info type (409 there).
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

emitents:
  get:
    tags: [Meas]
    operationId: listMeasEmitents
    x-permission: meas.read
    summary: All emitents, by id
    responses:
      '200':
        description: Every emitent, active or not (not paged; a bare array).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/meas.yaml#/MeasLookup
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Meas]
    operationId: createMeasEmitent
    x-permission: meas.create
    summary: Create an emitent
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/meas.yaml#/MeasLookupUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/meas.yaml#/MeasLookup
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

emitent:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Meas]
    operationId: getMeasEmitent
    x-permission: meas.read
    summary: Emitent by id
    responses:
      '200':
        description: The emitent with all its translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/meas.yaml#/MeasLookup
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Meas]
    operationId: updateMeasEmitent
    x-permission: meas.update
    summary: Replace an emitent
    description: Locales absent from `translations` are deleted; an empty map is rejected (400).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/meas.yaml#/MeasLookupUpsert
    responses:
      '200':
        description: The updated emitent.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/meas.yaml#/MeasLookup
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [Meas]
    operationId: deleteMeasEmitent
    x-permission: meas.delete
    summary: Delete an emitent
    description: Hard delete. Refused while any document (including soft-deleted ones) references it.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict

