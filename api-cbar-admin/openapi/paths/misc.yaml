healthz:
  get:
    tags: [Health]
    operationId: getHealth
    summary: Health probe (database connectivity)
    security: []
    responses:
      '200':
        description: Healthy.
        content:
          text/plain:
            schema:
              type: string
              const: Healthy
      '503':
        description: Unhealthy — PostgreSQL unreachable.
        content:
          text/plain:
            schema:
              type: string
              const: Unhealthy
