# --- Strategy documents (spec 057) ---------------------------------------------
# The "Strategiya və sənədlər" homepage block. Unlike the blocks above, these rows have a status and are soft-deleted.

strategyDocs:
  get:
    tags: [Homepage]
    operationId: listHomepageStrategyDocs
    x-permission: homepage_strategy_docs.read
    summary: Homepage strategy documents, by sort order
    description: |
      Soft-deleted documents are excluded. The site shows the first three published documents that have a title and a
      working link in its locale; `linkBroken` marks a document that has a working link in no locale. `search` matches the
      title in any locale literally (`%` and `_` are not wildcards); longer than 200 characters is a 400.
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/Status
    responses:
      '200':
        description: One page of documents.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/StrategyDocPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Homepage]
    operationId: createHomepageStrategyDoc
    x-permission: homepage_strategy_docs.create
    summary: Create a homepage strategy document
    description: Appended after the other documents.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/homepage.yaml#/StrategyDocUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/StrategyDocDetail
      '400':
        description: |
          Model binding failed (`errors` keyed by JSON path), the controller rejected a field (`StrategyDocFieldProblem`,
          e.g. `translations.az.title`, `pageId`, `translations.en.coverMediaId`), or the database rejected a value
          (`urn:cbar:problem:*`).
        content:
          application/problem+json:
            schema:
              anyOf:
                - $ref: ../components/schemas/common.yaml#/ValidationProblemDetails
                - $ref: ../components/schemas/homepage.yaml#/StrategyDocFieldProblem
                - $ref: ../components/schemas/common.yaml#/ErrorMessage
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

strategyDoc:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Homepage]
    operationId: getHomepageStrategyDoc
    x-permission: homepage_strategy_docs.read
    summary: Homepage strategy document by id
    responses:
      '200':
        description: The document with all its translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/StrategyDocDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Homepage]
    operationId: updateHomepageStrategyDoc
    x-permission: homepage_strategy_docs.update
    summary: Update a homepage strategy document
