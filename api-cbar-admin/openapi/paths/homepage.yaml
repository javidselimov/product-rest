# --- Info lines ------------------------------------------------------------

infoLines:
  get:
    tags: [Homepage]
    operationId: listInfoLines
    x-permission: info_lines.read
    summary: Info lines, grouped by alias
    description: |
      Lines ordered by alias, then year descending, then `sortOrder`; the page is cut from
      that line order and then grouped by alias (see `InfoLinePage`). Active and inactive
      lines are both returned.
    parameters:
      - name: alias
        in: query
        description: |
          Case-insensitive substring match (`ILIKE '%…%'`) on the alias. Blank is ignored.
          `%` and `_` are not escaped and act as wildcards.
        schema:
          type: string
      - $ref: ../components/parameters.yaml#/Page
      - name: pageSize
        in: query
        description: |
          Page size (counts lines, not groups). Clamped, never rejected: values below 1 use the
          default (50), values above 100 are capped at 100.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: One page of info lines, grouped by alias.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/InfoLinePage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Homepage]
    operationId: createInfoLine
    x-permission: info_lines.create
    summary: Create an info line
    description: '`alias` must not be blank and at least one translation is required.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/homepage.yaml#/InfoLineUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/InfoLine
      '400':
