# Homepage blocks. All deletes here are hard deletes (these tables have no soft-delete flag);
# translations go with the row. The strategy documents at the end (spec 057) are the exception: soft-deleted.

# --- Banners ---------------------------------------------------------------

banners:
  get:
    tags: [Homepage]
    operationId: listBanners
    x-permission: banners.read
    summary: All banners, by sort order
    description: Every banner, active or not, ordered by `sortOrder`, then id (not paged).
    responses:
      '200':
        description: All banners.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/BannerList
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Homepage]
    operationId: createBanner
    x-permission: banners.create
    summary: Create a banner
    description: |
      Needs an image (`mediaId`) or at least one translation; an image-only banner is valid.
      An unknown `mediaId` is rejected with 400.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/homepage.yaml#/BannerUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item. `originalName` is null here.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/Banner
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

banner:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Homepage]
    operationId: getBanner
    x-permission: banners.read
    summary: Banner by id
    responses:
      '200':
        description: The banner with all its translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/Banner
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Homepage]
    operationId: updateBanner
    x-permission: banners.update
    summary: Replace a banner
    description: |
      Locales absent from `translations` are deleted. The body is validated before the id is
      looked up, so an invalid body on an unknown id is 400, not 404.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/homepage.yaml#/BannerUpsert
    responses:
      '200':
        description: The updated banner. `originalName` is always null here; re-fetch to see it.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/homepage.yaml#/Banner
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [Homepage]
    operationId: deleteBanner
    x-permission: banners.delete
    summary: Delete a banner
    description: Hard delete. The image stays in the media library.
    responses:
