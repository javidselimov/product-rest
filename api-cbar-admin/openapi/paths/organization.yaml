staff:
  get:
    tags: [Organization]
    operationId: listStaff
    x-permission: organization.read
    summary: All staff members, by sort order
    description: Ordered by `sortOrder`, then id. Active and inactive members alike (not paged).
    parameters:
      - name: type
        in: query
        description: Only members of this type (`1` = board, `2` = director general, `3` = adviser to the Governor).
        schema:
          type: integer
          format: int16
    responses:
      '200':
        description: Every matching staff member.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/organization.yaml#/OrganizationStaff
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Organization]
    operationId: createStaffMember
    x-permission: organization.create
    summary: Create a staff member
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/OrganizationStaffUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/OrganizationStaff
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

staffMember:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Organization]
    operationId: getStaffMember
    x-permission: organization.read
    summary: Staff member by id
    responses:
      '200':
        description: The staff member with all translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/OrganizationStaff
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Organization]
    operationId: updateStaffMember
    x-permission: organization.update
    summary: Replace a staff member
    description: |
      Locales absent from `translations` are deleted. An empty `translations` map is rejected
      (400) before the id is looked up.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/OrganizationStaffUpsert
    responses:
      '200':
        description: The updated staff member.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/OrganizationStaff
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [Organization]
    operationId: deleteStaffMember
    x-permission: organization.delete
    summary: Delete a staff member
    description: Hard delete, together with its translations and press-photo links. The media assets stay.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

staffPhotos:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  post:
    tags: [Organization]
    operationId: attachStaffPhoto
    x-permission: organization.update
    summary: Add an uploaded photo to a staff member's press set
    description: |
      Appended after the existing photos. The same media asset cannot be attached to one member
      twice (409). Only `image/*` assets are accepted (400) — the public site offers the set as
      downloadable photographs.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/common.yaml#/AttachAsset
    responses:
      '200':
        description: The new staff photo.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/OrganizationStaffPhotoAttached
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict

staffPhotosOrder:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  put:
    tags: [Organization]
    operationId: reorderStaffPhotos
    x-permission: organization.update
    summary: Reorder a staff member's press photos
    description: '`photoIds` must be exactly the set of the member''s photo ids, otherwise 400.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/OrganizationStaffPhotoOrder
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

staffPhoto:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
    - name: photoId
      in: path
      required: true
      description: Route constraint `{photoId:long}`. The staff-photo id (`photos[].id`), not the media id.
      schema:
        type: integer
        format: int64
  delete:
    tags: [Organization]
    operationId: detachStaffPhoto
    x-permission: organization.update
    summary: Remove a photo from a staff member's press set
    description: |
      Removes the link only; the media asset itself stays. The remaining photos keep their
      `sortOrder` (a gap is left).
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: No photo with this id on this member.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/ProblemDetails

