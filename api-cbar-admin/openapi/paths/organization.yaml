chart:
  get:
    tags: [Organization]
    operationId: listOrgChartNodes
    x-permission: organization.read
    summary: Every node of the organisational chart, flat
    description: |
      Flat list ordered by `sortOrder`, then id; the client builds the tree from `parentId`.
      Active and inactive alike (not paged).
    responses:
      '200':
        description: Every chart node.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/organization.yaml#/OrgChartNode
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Organization]
    operationId: createOrgChartNode
    x-permission: organization.create
    summary: Create a chart node
    description: |
      The desktop chart is laid out from the tree (spec 060): parent, `sortOrder` among
      siblings, `kind` and `departmentsOpen`. The new node's `layout` and `connector` are null.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/OrgChartNodeUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/OrgChartNode
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

chartNode:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Organization]
    operationId: getOrgChartNode
    x-permission: organization.read
    summary: Chart node by id
    responses:
      '200':
        description: The node with all translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/OrgChartNode
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Organization]
    operationId: updateOrgChartNode
    x-permission: organization.update
    summary: Replace a chart node
    description: |
      Locales absent from `translations` are deleted. `layout` and `connector` are not part of
      the body and stay as they are; `departmentsOpen` omitted or null keeps the stored value.
      A `parentId` that is the node itself or one of its descendants is rejected (400).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/OrgChartNodeUpsert
    responses:
      '200':
        description: The updated node.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/OrgChartNode
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [Organization]
    operationId: deleteOrgChartNode
    x-permission: organization.delete
    summary: Delete a chart node
    description: |
      Hard delete, together with its translations and its `departmentsOpen` setting. The linked
      staff member or division stays.
      A node that still has children is refused (409) — move or delete them first.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict

chartLayout:
  put:
    tags: [Organization]
    operationId: updateOrgChartLayout
    x-permission: organization.update
    deprecated: true
    summary: Save desktop positions of chart nodes
    description: |
      Deprecated since spec 060: the desktop chart is laid out from the tree and the admin panel
      no longer calls this. The stored positions are kept for a rollback.

      Sets `layout` and `connector` of the listed nodes in one transaction; nodes not listed
      keep theirs. An unknown or repeated id is rejected (400) and nothing is saved.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/OrgChartLayoutUpdate
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

chartOrder:
  put:
    tags: [Organization]
    operationId: reorderOrgChartNodes
    x-permission: organization.update
    summary: Reorder the children of one chart node
    description: |
      `ids` must be exactly the children of `parentId` (the roots when null), inactive ones
      included, each once; otherwise 400 with `message`. Writes `sortOrder` 1…n in that order.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/OrgChartOrder
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
