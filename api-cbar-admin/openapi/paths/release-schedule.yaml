  put:
    tags: [ReleaseSchedule]
    operationId: updateReleaseScheduleGroup
    x-permission: release_schedule.update
    summary: Update a schedule group
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/release-schedule.yaml#/ReleaseScheduleGroupUpsert
    responses:
