login:
  post:
    tags: [Auth]
    operationId: login
    summary: Sign in with username and password
    description: |
      Returns a 15-minute access token in the body and sets the refresh token as an
      httpOnly cookie (`cbar_admin_rt`, `Path=/api/v1/auth`, `SameSite=Strict`, absolute
      lifetime 7 days). Keep the access token in memory; renew it with `POST /auth/refresh`.

      After 5 wrong passwords within 10 minutes the account is locked for 15 minutes; while
      locked, even the correct password is rejected with the same 401 as a wrong one. An
      administrator's password reset or reactivation clears the lock. Separately, more than
      10 attempts for one username within 120 seconds get 429 (spec 012).
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/LoginRequest
    responses:
      '200':
        description: Signed in.
        headers:
          Set-Cookie:
            description: The refresh-token cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/LoginResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        description: |
          Wrong username/password, inactive or unknown user, or a locked account — all
          return `Invalid credentials.` with no `code`, and take the same time. A locked
          account is not distinguishable from a wrong password.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorMessage
      '429':
        description: |
          More than 10 attempts for this username within 120 seconds, counted whether or not
          the user exists (`Too many login attempts. Try again later.`). Sent before the
          password is checked; it does not count towards the account lock.
        headers:
          Retry-After:
            description: Seconds until another attempt for this username is accepted.
            schema:
              type: integer
              minimum: 1
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorMessage

refresh:
  post:
    tags: [Auth]
    operationId: refreshSession
    summary: Exchange the refresh cookie for a new access token
    description: |
      Rotates the refresh cookie and returns a new access token; the role is re-read from
      the database. Call with `credentials: 'include'`. A request carrying an `Origin`
      header must come from a configured CORS origin; a request without one is allowed.
    security:
      - refreshCookie: []
    responses:
      '200':
        description: Session renewed; a rotated cookie is set.
        headers:
          Set-Cookie:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/LoginResponse
      '401':
        description: |
          Session cannot be renewed; send the user to login. `code` says why:
          - `refresh_missing` — no cookie.
          - `refresh_stale` — another tab rotated this cookie moments ago; the browser
            already holds the new one, so **retry once** (the cookie is not cleared).
          - `refresh_invalid`, `refresh_reused`, `refresh_expired` — the cookie is cleared.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/auth.yaml#/SessionError
      '403':
        $ref: ../components/responses.yaml#/OriginForbidden

logout:
  post:
    tags: [Auth]
    operationId: logout
    summary: Revoke the refresh-token family and clear the cookie
    description: Idempotent — a missing or unknown cookie still returns 204.
    security:
      - refreshCookie: []
    responses:
      '204':
        description: Signed out; the cookie is cleared.
        headers:
          Set-Cookie:
            schema:
              type: string
      '403':
        $ref: ../components/responses.yaml#/OriginForbidden
