collection:
  get:
    tags: [Events]
    operationId: listEvents
    x-permission: events.read
    summary: Events, latest start first
    description: Soft-deleted events are excluded.
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/Status
      - name: type
        in: query
        schema:
          $ref: ../components/schemas/events.yaml#/EventType
      - name: categoryId
        in: query
        schema:
          type: integer
          format: int32
    responses:
      '200':
        description: One page of events.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Events]
    operationId: createEvent
    x-permission: events.create
    summary: Create an event
    description: Slugs are generated from each title, unique per locale (`-2`, `-3` on collision).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/events.yaml#/EventUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        $ref: ../components/responses.yaml#/Conflict

item:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Events]
    operationId: getEvent
    x-permission: events.read
    summary: Event by id
    responses:
      '200':
        description: The event with all translations and linked items.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Events]
    operationId: updateEvent
    x-permission: events.update
    summary: Update an event
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/events.yaml#/EventUpsert
    responses:
      '200':
        description: The updated event.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
  delete:
    tags: [Events]
    operationId: deleteEvent
    x-permission: events.delete
    summary: Soft-delete an event
    description: The linked gallery, press release and page are left as they are.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

categories:
  get:
    tags: [Events]
    operationId: listEventCategories
    x-permission: events.read
    summary: Event categories, by sort order
    description: Inactive categories are included.
    responses:
      '200':
        description: The categories.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/events.yaml#/EventCategoryListItem
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Events]
    operationId: createEventCategory
    x-permission: events.create
    summary: Create an event category
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/events.yaml#/EventCategoryUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventCategoryDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

category:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Events]
    operationId: getEventCategory
    x-permission: events.read
    summary: Event category by id
    responses:
      '200':
        description: The category with its translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventCategoryDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Events]
    operationId: updateEventCategory
    x-permission: events.update
    summary: Update an event category
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/events.yaml#/EventCategoryUpsert
    responses:
      '200':
        description: The updated category.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/events.yaml#/EventCategoryDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [Events]
    operationId: deleteEventCategory
    x-permission: events.delete
    summary: Delete an event category
    description: Refused while an event that is not deleted uses it.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
