mePermissions:
  get:
    tags: [Access]
    operationId: getMyPermissions
    summary: The caller's role and effective permission codes
    description: |
      Open to every authenticated user (no permission code). `admin` gets the whole catalog;
      a user whose role has no permissions, or an unknown role, gets an empty list. Codes are
      sorted ordinally and unique.
    responses:
      '200':
        description: The caller's role and permissions.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rbac.yaml#/MePermissions
      '401':
        $ref: ../components/responses.yaml#/Unauthorized

roles:
  get:
    tags: [Access]
    operationId: listRoles
    summary: Roles with their permission codes
    description: |
      The role → permission matrix, by role id. Read-only: the matrix changes only through a
      migration. `admin` lists the whole catalog, which it holds in code rather than in
      `role_permissions`.
    x-permission: roles.read
    responses:
      '200':
        description: Every role, as a bare array.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/rbac.yaml#/RoleWithPermissions
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

auditLog:
  get:
    tags: [Access]
    operationId: listAuditLog
    summary: Audit log entries, newest first
    description: |
      Who changed what, and every refused attempt (`action` `authz.denied`). Filters combine
      with AND. `action` is a prefix match: `authz.` lists refused attempts, `currency_rates.`
      the exchange-rate history.
    x-permission: audit.read
    parameters:
      - name: action
        in: query
        description: Prefix of the action code, matched case-sensitively.
        schema:
          type: string
      - name: actorId
        in: query
        schema:
          type: integer
          format: int32
      - name: entityType
        in: query
        description: Exact entity type.
        schema:
          type: string
      - name: entityId
        in: query
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        description: Inclusive lower bound on `createdAt`.
        schema:
          $ref: ../components/schemas/common.yaml#/DateTime
      - name: to
        in: query
        description: Exclusive upper bound on `createdAt`.
        schema:
          $ref: ../components/schemas/common.yaml#/DateTime
      - $ref: ../components/parameters.yaml#/Page
      - name: pageSize
        in: query
        description: |
          Page size. Clamped, never rejected: values below 1 use the default (50), values above 100
          are capped at 100. The response's `pageSize` is the value applied.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: One page of entries.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rbac.yaml#/AuditLogPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
