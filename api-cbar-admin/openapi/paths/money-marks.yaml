marks:
  get:
    tags: [MoneyMarks]
    operationId: listMoneyMarks
    x-permission: money_marks.read
    summary: Banknotes and coins, by sort order
    description: Ordered by `sortOrder`, then id. Soft-deleted items are excluded. No text search.
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
      - name: type
        in: query
        description: Only items of this type code (`1` = banknote, `2` = coin).
        schema:
          type: integer
          format: int16
      - name: categoryId
        in: query
        description: Only items in this category.
        schema:
          type: integer
          format: int32
      - $ref: ../components/parameters.yaml#/Status
    responses:
      '200':
        description: One page of money marks.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/money-marks.yaml#/MoneyMarkPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [MoneyMarks]
    operationId: createMoneyMark
    x-permission: money_marks.create
    summary: Create a banknote or coin
    description: |
      Slugs are generated from each title, unique per locale (`-2`, `-3` on collision).
      Rejected with 400 when `translations` is empty, or `categoryId`, `frontMediaId` or
      `rearMediaId` does not exist.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/money-marks.yaml#/MoneyMarkUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/money-marks.yaml#/MoneyMarkDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        description: 'Another item in the same language took this slug concurrently (`urn:cbar:problem:unique-violation`, `field: slug`); saving again picks a free one.'
        $ref: ../components/responses.yaml#/Conflict

mark:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [MoneyMarks]
    operationId: getMoneyMark
    x-permission: money_marks.read
    summary: Banknote or coin by id
    responses:
      '200':
        description: The item with all translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/money-marks.yaml#/MoneyMarkDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [MoneyMarks]
    operationId: updateMoneyMark
    x-permission: money_marks.update
    summary: Replace a banknote or coin
    description: |
      Locales absent from `translations` are deleted; an empty map is rejected (400). A slug
      is regenerated only when that locale's title changes. Omitting `frontMediaId` /
      `rearMediaId` clears the image. Same reference checks as create.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/money-marks.yaml#/MoneyMarkUpsert
    responses:
      '200':
        description: The updated item.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/money-marks.yaml#/MoneyMarkDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: 'Another item in the same language took this slug concurrently (`urn:cbar:problem:unique-violation`, `field: slug`); saving again picks a free one.'
        $ref: ../components/responses.yaml#/Conflict
  delete:
    tags: [MoneyMarks]
    operationId: deleteMoneyMark
    x-permission: money_marks.delete
    summary: Soft-delete a banknote or coin
    description: The item keeps blocking deletion of its category (409 there).
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

