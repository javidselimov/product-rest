collection:
  get:
    tags: [PressReleases]
    operationId: listPressReleases
    x-permission: press_releases.read
    summary: Press releases, newest first
    description: Ordered by `publishedAt`, falling back to creation time. Soft-deleted items are excluded.
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/Status
      - $ref: ../components/parameters.yaml#/PressReleaseType
    responses:
      '200':
        description: One page of press releases.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/press-releases.yaml#/PressReleasePage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [PressReleases]
    operationId: createPressRelease
    x-permission: press_releases.create
    summary: Create a press release
    description: Slugs are generated from each title, unique per locale (`-2`, `-3` on collision).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/press-releases.yaml#/PressReleaseUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/press-releases.yaml#/PressReleaseDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        description: 'Another item in the same language took this slug concurrently (`urn:cbar:problem:unique-violation`, `field: slug`); saving again picks a free one.'
        $ref: ../components/responses.yaml#/Conflict

item:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [PressReleases]
    operationId: getPressRelease
    x-permission: press_releases.read
    summary: Press release by id
    responses:
      '200':
        description: The press release with all translations and attachments.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/press-releases.yaml#/PressReleaseDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [PressReleases]
    operationId: updatePressRelease
    x-permission: press_releases.update
    summary: Replace a press release
    description: |
      Locales absent from `translations` are deleted. A slug is regenerated only when
      that locale's title changes. Attachments are managed separately (`/assets`).
      Unlike create, an empty `translations` map is accepted. An omitted or null `type`
      keeps the stored one; any value other than 1, 2 or 3 is a 400 with `message`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/press-releases.yaml#/PressReleaseUpsert
    responses:
      '200':
        description: |
          The updated press release. `assets` is always empty here (not loaded on update);
          re-fetch the item to see them.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/press-releases.yaml#/PressReleaseDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: 'Another item in the same language took this slug concurrently (`urn:cbar:problem:unique-violation`, `field: slug`); saving again picks a free one.'
        $ref: ../components/responses.yaml#/Conflict
  delete:
    tags: [PressReleases]
    operationId: deletePressRelease
    x-permission: press_releases.delete
    summary: Soft-delete a press release
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

assets:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  post:
    tags: [PressReleases]
    operationId: attachPressReleaseAsset
    x-permission: press_releases.update
    summary: Attach an uploaded file
    description: Appended after the existing attachments.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/common.yaml#/AttachAsset
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict

assetsOrder:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  put:
    tags: [PressReleases]
    operationId: reorderPressReleaseAssets
    x-permission: press_releases.update
    summary: Reorder a press release's attachments
    description: |
      `mediaIds` must be exactly the set of the press release's attached media ids, otherwise
      400 with `message`. The first image attachment becomes the cover on the public site,
      the remaining images the photo gallery.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/press-releases.yaml#/PressReleaseAssetOrder
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

assetLocale:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
    - $ref: ../components/parameters.yaml#/MediaId
  put:
    tags: [PressReleases]
    operationId: setPressReleaseAssetLocale
    x-permission: press_releases.update
    summary: Set an attachment's language
    description: |
      Null shows the file in both languages (the default of every attachment). A language
      limits it to that locale on the public site, where it also stops counting towards the
      cover, the list card image and the download button of the other language. An unknown
      locale is a 400 with `message`. Audited as `press_releases.set_asset_locale`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/press-releases.yaml#/PressReleaseAssetLocale
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

asset:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
    - $ref: ../components/parameters.yaml#/MediaId
  delete:
    tags: [PressReleases]
    operationId: detachPressReleaseAsset
    x-permission: press_releases.update
    summary: Detach a file
    description: Removes the attachment only; the media asset itself stays.
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
