# FAQ (spec 051): topics, questions and videos of the "Sual-cavab" panel section.
topicsCollection:
  get:
    tags: [Faq]
    operationId: listFaqTopics
    x-permission: faq.read
    summary: FAQ topics, by sort order
    description: "Soft-deleted topics are excluded. `search` matches the name in any locale."
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/Status
      - name: pageId
        in: query
        description: "Only topics linked to this CMS page (the page form shows them)."
        schema:
          type: integer
          format: int32
          minimum: 1
    responses:
      '200':
        description: One page of topics.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/faq.yaml#/FaqTopicPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Faq]
    operationId: createFaqTopic
    x-permission: faq.create
    summary: Create an FAQ topic
    description: "The slug is generated from the az (else en) name and never changes; the topic is appended after the others."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/faq.yaml#/FaqTopicUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/faq.yaml#/FaqTopicDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

topicsItem:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    tags: [Faq]
    operationId: getFaqTopic
    x-permission: faq.read
    summary: FAQ topic by id
    responses:
      '200':
        description: The topic with all translations.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/faq.yaml#/FaqTopicDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    tags: [Faq]
    operationId: updateFaqTopic
    x-permission: faq.update
    summary: Update an FAQ topic
    description: "A locale left out of `translations` is removed; `pageIds` replaces the linked pages. The slug is kept."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/faq.yaml#/FaqTopicUpsert
    responses:
      '200':
        description: The updated topic.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/faq.yaml#/FaqTopicDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  delete:
    tags: [Faq]
    operationId: deleteFaqTopic
    x-permission: faq.delete
    summary: Soft-delete an FAQ topic
    description: "409 with `message` while the topic still has non-deleted questions: move or delete them first."
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict

topicsOrder:
  put:
    tags: [Faq]
    operationId: reorderFaqTopics
    x-permission: faq.update
    summary: Reorder the FAQ topics
    description: "`ids` must be exactly the set of non-deleted topics, otherwise 400 with `message`."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/faq.yaml#/FaqOrder
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

topicQuestionsOrder:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  put:
    tags: [Faq]
    operationId: reorderFaqTopicQuestions
    x-permission: faq.update
    summary: Reorder a topic's questions
    description: "`ids` must be exactly the set of the topic's non-deleted questions, otherwise 400 with `message`."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/faq.yaml#/FaqOrder
    responses:
      '204':
        $ref: ../components/responses.yaml#/NoContent
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound

questionsCollection:
  get:
    tags: [Faq]
    operationId: listFaqQuestions
    x-permission: faq.read
    summary: FAQ questions, by sort order
    description: "Soft-deleted questions are excluded. Ordered by the topic order, then the question order. `search` matches the question text in any locale."
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize20
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/Status
      - name: topicId
        in: query
        description: "Only questions of this topic."
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: missingLocale
        in: query
        description: "Only questions not complete in this locale (translation work)."
        schema:
          $ref: ../components/schemas/common.yaml#/Locale
    responses:
      '200':
        description: One page of questions.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/faq.yaml#/FaqQuestionPage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [Faq]
    operationId: createFaqQuestion
    x-permission: faq.create
    summary: Create an FAQ question
    description: "Appended at the end of its topic."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/faq.yaml#/FaqQuestionUpsert
    responses:
      '201':
        description: Created; `Location` points at the new item.
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/faq.yaml#/FaqQuestionDetail
      '400':
        $ref: ../components/responses.yaml#/BusinessRule
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden

